/* =====================================================================
 * Baloncuk Canavarları — arayüz stilleri
 * Yerleşim: dikey telefon önce. Tuval (oyun dünyası) en altta; menü ve
 * paneller DOM ile üstte. Tek görsel dünya (koyu lagün), tema değişmez.
 * ===================================================================== */
:root {
  color-scheme: dark;
  --ink: #2B1260;
  --ink-deep: #170638;
  --night: #1B0C4A;
  --lagoon: #1ED6C6;
  --grape: #A262F2;
  --gum: #FF5AA8;
  --sun: #FFD23C;
  --sky: #3F8CFF;
  --coral: #FF7E50;
  --paper: #FFFFFF;
  --paper-2: #F3EAFF;
  --paper-line: #ECE2FF;
  --text-dark: #34176E;
  --muted-dark: #6B5A9E;
  --font: ui-rounded, "SF Pro Rounded", "BC Poppins", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --logo-fs: min(11.4vw, 6.3vh, 58px);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--night); }
body {
  font-family: var(--font);
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button { font-family: inherit; touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus { outline: none; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
[hidden] { display: none !important; }

.app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
.world { position: absolute; inset: 0; display: block; touch-action: none; }
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.inset-probe {
  position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
}
.ico { width: 24px; height: 24px; fill: currentColor; flex: none; }

/* ---------- Ekranlar ---------- */
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.03);
  transition: opacity .24s ease, transform .3s cubic-bezier(.2, .9, .3, 1.15), visibility 0s linear .3s;
}
.screen.is-active {
  opacity: 1; visibility: visible; pointer-events: auto; transform: none;
  transition: opacity .24s ease, transform .3s cubic-bezier(.2, .9, .3, 1.15), visibility 0s;
}
.screen-game, .screen-game.is-active { pointer-events: none; transform: none; }
.screen-game .pause-btn, .screen-game .tut-skip { pointer-events: auto; }

/* ---------- Ortak düğmeler ---------- */
.btn {
  --c1: #34F0C8; --c2: #12B89E; --edge: #087A6A; --tx: #06574C;
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 12px 20px; border: 0; border-radius: 20px;
  font: 700 18px/1.1 var(--font); color: #fff; letter-spacing: .01em;
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: 0 6px 0 var(--edge), 0 12px 18px rgba(12, 2, 40, .42), inset 0 2px 0 rgba(255, 255, 255, .6), inset 0 -3px 0 rgba(0, 0, 0, .08);
  text-shadow: 0 2px 0 var(--tx), 2px 0 0 var(--tx), -2px 0 0 var(--tx), 0 -2px 0 var(--tx),
    1.4px 1.4px 0 var(--tx), -1.4px 1.4px 0 var(--tx), 1.4px -1.4px 0 var(--tx), -1.4px -1.4px 0 var(--tx), 0 3px 0 var(--tx);
  transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
}
.btn::after {
  content: ""; position: absolute; left: 10%; right: 10%; top: 5px; height: 36%;
  border-radius: 999px; background: linear-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, 0)); pointer-events: none;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--edge), 0 4px 8px rgba(12, 2, 40, .4), inset 0 2px 0 rgba(255, 255, 255, .5); }
.btn .ico { width: 22px; height: 22px; filter: drop-shadow(0 2px 0 var(--tx)); }
.btn-primary { --c1: #3CF2CB; --c2: #12B89E; --edge: #087A6A; --tx: #06574C; }
.btn-secondary { --c1: #BE95FF; --c2: #8649E8; --edge: #5A25B0; --tx: #3E1287; }
.btn-danger { --c1: #FFA07D; --c2: #F0603A; --edge: #B33A1C; --tx: #7E2410; }
.btn-icon {
  --c1: #FFFFFF; --c2: #E7DAFF; --edge: #A98BE8; --tx: transparent;
  width: 56px; min-width: 56px; padding: 0; color: var(--ink); border-radius: 18px;
}
.btn-icon .ico { width: 26px; height: 26px; filter: none; }

.round-btn {
  position: relative; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%;
  color: var(--ink); background: linear-gradient(180deg, #FFFFFF, #E2D3FF);
  box-shadow: 0 4px 0 #9C7EDB, 0 8px 14px rgba(12, 2, 40, .4), inset 0 2px 0 #fff;
  transition: transform .08s ease, box-shadow .08s ease;
}
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9C7EDB, 0 3px 6px rgba(12, 2, 40, .4); }
.round-btn .ico { width: 24px; height: 24px; }
.round-btn.small { width: 38px; height: 38px; }
.round-btn.small .ico { width: 18px; height: 18px; }

.res-pill {
  display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px 0 5px; border-radius: 999px;
  background: rgba(20, 6, 60, .62); border: 2px solid rgba(255, 255, 255, .16); color: #fff;
  font: 700 17px/1 var(--font); font-variant-numeric: tabular-nums;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18);
}
.res-pill .ico { width: 30px; height: 30px; padding: 4px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
.res-pill .ico-star { fill: var(--sun); filter: drop-shadow(0 1.5px 0 #B86A00); }
.res-pill .ico-coin { fill: #FFC21A; }
button.res-pill { transition: transform .08s; }
button.res-pill:active { transform: scale(.95); }
.res-plus {
  display: grid; place-items: center; width: 20px; height: 20px; margin-left: 2px; border-radius: 50%;
  background: #3CF2CB; color: var(--ink); font-size: 16px; font-weight: 800; line-height: 1;
}

/* ---------- Yükleniyor ---------- */
.splash {
  position: absolute; inset: 0; z-index: 90; display: grid; place-content: center; gap: 18px; justify-items: center;
  background: radial-gradient(circle at 50% 40%, #4B2A9F, #1B0C4A 70%); transition: opacity .4s ease;
}
.splash.out { opacity: 0; pointer-events: none; }
.splash-bubble {
  width: 74px; height: 74px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #fff 0 9%, #B4FFF7 10%, #1ED6C6 48%, #08A097 88%, #05605F);
  box-shadow: 0 0 0 4px rgba(255, 255, 255, .15), 0 10px 30px rgba(0, 0, 0, .4);
  animation: splashBob 1s ease-in-out infinite alternate;
}
.splash-text { margin: 0; font-weight: 700; font-size: 16px; opacity: .85; }
@keyframes splashBob { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-14px) scale(.96, 1.04); } }

/* ---------- Ana menü (Aşama 5: Pofi merkezde, OYNA en belirgin eylem) ----------
 * Görsel öncelik: 1) üstte yıldız/altın 2) logo + Pofi + baloncuk dünyası (tuvalde)
 * 3) seviye bilgisi + OYNA 4) Seviyeler / Koleksiyon 5) küçük "Yakında" şeridi.
 * Tüm boyutlar ekran yüksekliğine göre küçülür; kaydırma yok, güvenli alanlar korunur. */
.screen-menu { padding-top: calc(var(--sat) + 10px); padding-left: var(--sal); padding-right: var(--sar); }
.topbar {
  display: flex; align-items: center; gap: 8px; width: min(100%, 520px); margin: 0 auto; padding: 0 16px;
}
.topbar .res-coins { margin-right: auto; }

.hero {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0; padding: 2px 16px 0;
}
.logo {
  margin: 0; display: flex; flex-direction: column; align-items: center; line-height: .98;
  font-weight: 800; font-size: var(--logo-fs); letter-spacing: -.01em;
  filter: drop-shadow(0 6px 10px rgba(10, 0, 40, .45));
}
.logo-line { display: flex; white-space: nowrap; }
.logo-line + .logo-line { margin-top: .02em; }
.logo-ch {
  position: relative; display: inline-block;
  transform: rotate(var(--r));
  animation: letterBob 2.8s ease-in-out infinite;
  animation-delay: calc(var(--i) * -.14s);
}
.logo-ch .ch-stroke {
  position: absolute; left: 0; top: 0; color: var(--ink);
  -webkit-text-stroke: .21em var(--ink);
  text-shadow: 0 .12em 0 var(--ink-deep);
}
.logo-ch .ch-fill {
  position: relative; display: inline-block; color: transparent;
  background: linear-gradient(180deg, #FFFFFF 0%, var(--l) 22%, var(--b) 58%, var(--d) 100%);
  -webkit-background-clip: text; background-clip: text;
}
.c-a { --l: #B4FFF7; --b: #1ED6C6; --d: #069890; }
.c-b { --l: #E7D4FF; --b: #A262F2; --d: #6A2FC4; }
.c-c { --l: #FFD4E8; --b: #FF5AA8; --d: #CC2675; }
.c-d { --l: #FFF7C9; --b: #FFD23C; --d: #E79A08; }
.c-e { --l: #CFE3FF; --b: #3F8CFF; --d: #1F57CF; }
.c-f { --l: #FFD9C9; --b: #FF7E50; --d: #DB4A24; }
@keyframes letterBob {
  0%, 100% { transform: translateY(0) rotate(var(--r)); }
  50% { transform: translateY(-.06em) rotate(calc(var(--r) * -1)); }
}

/* Pofi: menünün yıldızı. Hale, bulutlar ve baloncuklar arka plan tuvalinde çizilir. */
.mascot {
  display: block; height: clamp(110px, 33vh, 290px); width: auto; aspect-ratio: 200 / 190;
  flex: 0 1 auto; min-height: 0; margin-top: 0; touch-action: manipulation; cursor: pointer;
}

.menu-main {
  display: flex; flex-direction: column; gap: 12px; width: min(100%, 460px); margin: 0 auto;
  padding: 4px 16px calc(var(--sab) + 12px);
}
/* seviye bilgisi: tek satır, sade (yıldız toplamı üstte zaten var) */
.progress-card {
  display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "w n d" "b b b";
  align-items: center; column-gap: 8px; row-gap: 6px; padding: 8px 14px 9px; border-radius: 18px;
  background: rgba(20, 6, 60, .5); border: 2px solid rgba(255, 255, 255, .13);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15);
}
.pc-world {
  grid-area: w; font-size: 12px; font-weight: 800; color: var(--ink); background: #B4FFF7; padding: 3px 8px; border-radius: 999px;
}
.pc-name { grid-area: n; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pc-done { grid-area: d; font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, .85); font-variant-numeric: tabular-nums; }
.pc-bar { grid-area: b; position: relative; height: 9px; border-radius: 999px; background: rgba(0, 0, 0, .35); overflow: hidden; }
.pc-bar i {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, #1ED6C6, #A262F2 55%, #FF5AA8);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35); transition: width .6s cubic-bezier(.2, .9, .3, 1);
}

/* OYNA: sarıdan turuncuya, ölçülü parlama, bekleme nabzı, basılma + geri yaylanma */
.btn-play {
  --c1: #FFEA5C; --c2: #FFB224; --c3: #FF8A1C; --edge: #C45A00; --tx: #8A3A00;
  flex-direction: column; gap: 2px; width: min(100%, 360px); min-height: 84px; margin: 2px auto 2px; border-radius: 999px;
  background: linear-gradient(180deg, #FFF6A8 0%, var(--c1) 18%, var(--c2) 62%, var(--c3) 100%);
  box-shadow: 0 6px 0 var(--edge), 0 0 0 3px rgba(255, 255, 255, .22), 0 0 26px rgba(255, 196, 60, .45), 0 14px 22px rgba(12, 2, 40, .45),
    inset 0 3px 0 rgba(255, 255, 255, .65), inset 0 -6px 10px rgba(214, 90, 0, .35);
  animation: playPulse 2.4s ease-in-out infinite;
  transition: transform .09s ease, box-shadow .09s ease;
}
.btn-play::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .5) 47%, transparent 59%) no-repeat;
  background-size: 250% 100%; background-position: 130% 0;
  animation: playShine 3.6s ease-in-out infinite;
}
.bp-label {
  font-size: 38px; line-height: 1; letter-spacing: .05em; color: #fff;
  text-shadow: 0 3px 0 var(--edge), 2px 0 0 var(--edge), -2px 0 0 var(--edge), 0 -2px 0 var(--edge), 2px 2px 0 var(--edge), -2px 2px 0 var(--edge);
}
.bp-sub { font-size: 14px; font-weight: 800; }
@keyframes playPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
@keyframes playShine { 0%, 55% { background-position: 130% 0; } 85%, 100% { background-position: -30% 0; } }
.btn-play:active, .btn-play.is-pressed {
  animation: none; transform: translateY(5px) scale(.97);
  box-shadow: 0 1px 0 var(--edge), 0 0 0 3px rgba(255, 255, 255, .22), 0 0 18px rgba(255, 196, 60, .35), 0 5px 10px rgba(12, 2, 40, .4), inset 0 3px 0 rgba(255, 255, 255, .5);
}
.btn-play.is-launch { animation: playSpring .32s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes playSpring { 0% { transform: translateY(5px) scale(.96); } 60% { transform: translateY(-2px) scale(1.05); } 100% { transform: scale(1); } }
.btn-play[aria-busy="true"] { pointer-events: none; }

/* çalışan bölümler: iki büyük kart */
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  --c1: #5AA2FF; --c2: #2F6FE8; --edge: #1C4AA8;
  position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-items: center;
  column-gap: 10px; row-gap: 2px; text-align: left;
  min-height: 72px; padding: 10px 14px 11px; border: 0; border-radius: 22px; color: #fff;
  font: 800 17px/1.05 var(--font);
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: 0 5px 0 var(--edge), 0 10px 16px rgba(12, 2, 40, .4), inset 0 2px 0 rgba(255, 255, 255, .5);
  transition: transform .08s ease, box-shadow .08s ease;
}
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge), 0 4px 8px rgba(12, 2, 40, .4); }
.tile .ico { grid-row: 1 / span 2; width: 38px; height: 38px; color: #fff; fill: #fff; filter: drop-shadow(0 2px 0 var(--edge)); }
.tile span {
  text-shadow: 0 2px 0 var(--edge), 1.5px 0 0 var(--edge), -1.5px 0 0 var(--edge), 0 -1.5px 0 var(--edge);
}
.tile-sub { font: 700 12.5px/1 var(--font); color: rgba(255, 255, 255, .9); font-variant-numeric: tabular-nums; }
.tile-blue { --c1: #62A8FF; --c2: #2F6FE8; --edge: #1C4AA8; }
.tile-purple { --c1: #BE95FF; --c2: #8649E8; --edge: #5A25B0; }
.tile-teal { --c1: #3CEBD4; --c2: #0FAE9E; --edge: #087A6A; }
.tile-pink { --c1: #FF92C8; --c2: #F0479A; --edge: #B21F68; }
.tile-coral { --c1: #FFA982; --c2: #F26A3E; --edge: #B33A1C; }
.tile-yellow { --c1: #FFE760; --c2: #FFB21E; --edge: #C46A00; }

/* henüz hazır olmayanlar: küçük, ikincil, kilitli şerit (başlık kenarlıkta) */
.menu-soon {
  position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 3px;
  padding: 11px 8px 6px; border-radius: 18px; background: rgba(20, 6, 60, .42); border: 1.5px dashed rgba(255, 255, 255, .24);
}
.ms-label {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 8px; border-radius: 999px; white-space: nowrap;
  background: var(--ink); border: 1.5px solid rgba(255, 255, 255, .3); font: 800 11px/1 var(--font); color: #FFE7A0; letter-spacing: .02em;
}
.ms-label .ico { width: 12px; height: 12px; fill: #FFE7A0; }
.soon-chip {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; height: 44px; padding: 0 2px;
  border: 0; border-radius: 12px; color: rgba(255, 255, 255, .76); background: rgba(255, 255, 255, .08); font: 700 11px/1 var(--font);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18); transition: transform .08s ease, background .12s ease;
}
.soon-chip span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
.soon-chip .ico { width: 16px; height: 16px; fill: currentColor; opacity: .8; }
.soon-chip:active { transform: scale(.94); background: rgba(255, 255, 255, .18); }

/* ---------- Alt ekranlar ---------- */
.screen-sub { padding-top: calc(var(--sat) + 10px); }
.subbar {
  display: flex; align-items: center; gap: 12px; width: min(100%, 640px); margin: 0 auto; padding: 0 16px 10px;
}
.subbar h2 {
  flex: 1; margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .01em;
  text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink);
}
.scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  width: min(100%, 640px); margin: 0 auto; padding: 4px 16px calc(var(--sab) + 24px);
}
.sub-lead { margin: 0 0 12px; font-weight: 600; color: rgba(255, 255, 255, .85); }

/* ---------- 1.000 seviyelik harita (sanallaştırılmış; 51-level-map.js) ---------- */
.map-scroll {
  position: relative; flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; outline: none;
}
.map-inner { position: relative; margin: 0 auto; }
.map-layer, .ml { position: absolute; inset: 0; }
.ml-bg, .ml-path, .ml-ban, .ml-node { pointer-events: none; }
.mbanner, .mnode { pointer-events: auto; }
.mworld {
  position: absolute; left: 0; right: 0; border-radius: 26px;
  background:
    radial-gradient(circle at 12% 18%, rgba(255, 255, 255, .07) 0 22px, transparent 23px) 0 0 / 190px 230px,
    radial-gradient(circle at 78% 62%, rgba(255, 255, 255, .05) 0 14px, transparent 15px) 0 0 / 150px 170px,
    linear-gradient(180deg, var(--wt), var(--wb) 48%, var(--wt));
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08);
}
.mpath { position: absolute; left: 0; overflow: visible; }
.mpath path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mp-base { stroke: rgba(10, 2, 40, .35); stroke-width: 18; }
.mp-done { stroke: rgba(255, 236, 160, .9); stroke-width: 12; }
.mp-dots { stroke: rgba(255, 255, 255, .55); stroke-width: 4; stroke-dasharray: 1 14; }

.mnode {
  position: absolute; left: 0; top: 0; width: 64px; height: 78px; padding: 0; border: 0; background: none; color: #fff;
  display: flex; flex-direction: column; align-items: center; gap: 2px; contain: layout style;
}
.mnode:active .mn-bubble { transform: scale(.9); }
.mn-bubble {
  position: relative; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #fff 0 8%, var(--l) 9%, var(--b) 48%, var(--d) 92%);
  box-shadow: 0 4px 0 rgba(23, 6, 56, .55), inset 0 -4px 6px rgba(0, 0, 0, .15);
  font-size: 19px; font-weight: 800; transition: transform .1s;
}
.mn-bubble b { text-shadow: 0 2px 0 var(--ink), 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 -1.5px 0 var(--ink); font-variant-numeric: tabular-nums; }
.mn-lock { display: none; width: 22px; height: 22px; color: #fff; fill: #fff; opacity: .9; }
.mnode.is-locked .mn-bubble { --l: #CFC6E6; --b: #8C80B3; --d: #5D527F; filter: saturate(.6); }
.mnode.is-locked .mn-bubble b { display: none; }
.mnode.is-locked .mn-lock { display: block; }
.mnode.is-locked .mn-stars { visibility: hidden; }
.mnode.is-hard .mn-bubble { box-shadow: 0 4px 0 rgba(23, 6, 56, .55), 0 0 0 3px rgba(255, 126, 80, .85); }
.mnode.is-boss { transform-origin: 50% 40%; }
.mnode.is-boss .mn-bubble { width: 62px; height: 62px; box-shadow: 0 4px 0 rgba(23, 6, 56, .55), 0 0 0 4px #FFD23C; }
.mnode.is-current .mn-bubble { animation: currentPulse 1.6s ease-in-out infinite; }
.mn-stars { display: flex; gap: 1px; }
.mn-stars i { display: block; width: 14px; height: 14px; }
.mn-stars .ico { width: 14px; height: 14px; fill: rgba(255, 255, 255, .25); }
.mn-stars i.on .ico { fill: var(--sun); filter: drop-shadow(0 1px 0 #9A5200); }
.mn-badge {
  position: absolute; top: -8px; right: -10px; display: none; align-items: center; gap: 2px;
  padding: 3px 7px 3px 5px; border-radius: 999px; font: 700 10.5px/1 var(--font); color: var(--ink);
  background: #FFE760; border: 2px solid #fff; box-shadow: 0 2px 0 rgba(23, 6, 56, .45);
}
.mn-badge .ico { width: 13px; height: 13px; fill: var(--ink); }
.mnode.has-badge .mn-badge, .mnode.is-hard .mn-badge, .mnode.is-boss .mn-badge { display: flex; }
.mnode.is-hard .mn-badge { padding: 3px; background: #FF9A6B; }
.mnode.is-boss .mn-badge { padding: 3px; background: #FFD23C; }
.mnode.shake .mn-bubble { animation: shakeX .35s; }
@keyframes currentPulse {
  0%, 100% { box-shadow: 0 4px 0 rgba(23, 6, 56, .55), 0 0 0 0 rgba(255, 231, 96, .9); }
  50% { box-shadow: 0 4px 0 rgba(23, 6, 56, .55), 0 0 0 9px rgba(255, 231, 96, 0); }
}
@keyframes shakeX { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.map-marker { position: absolute; left: 0; top: 0; width: 56px; height: 56px; pointer-events: none; animation: markerBob 1.6s ease-in-out infinite; }
@keyframes markerBob { 50% { translate: 0 -5px; } }

.mbanner {
  position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 26px 26px 18px 18px;
  box-shadow: 0 6px 0 rgba(10, 2, 40, .35);
}
.mb-art { position: absolute; left: 0; top: 0; display: block; }
.mb-card {
  position: absolute; left: 10px; right: 10px; top: 116px; padding: 10px 12px 10px; border-radius: 20px;
  color: var(--text-dark); background: rgba(255, 255, 255, .93); box-shadow: 0 4px 0 rgba(23, 6, 56, .35);
  display: grid; gap: 6px;
}
.mb-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mb-head h3 { margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mb-num { flex: none; font-size: 11.5px; font-weight: 800; color: #fff; background: var(--ink); padding: 4px 9px; border-radius: 999px; }
.mb-desc { margin: -2px 0 0; font-size: 12.5px; line-height: 1.3; color: var(--muted-dark); font-weight: 600;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.mb-prog { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
.mb-prog .ico-star { width: 16px; height: 16px; fill: var(--sun); vertical-align: -3px; margin-right: 2px; filter: drop-shadow(0 1px 0 #B86A00); }
.mb-chests { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mb-chest {
  display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; padding: 5px 4px; border: 0; border-radius: 12px;
  font: 800 12.5px/1 var(--font); color: var(--ink); background: var(--paper-line);
}
.mb-chest > .ico { width: 22px; height: 22px; fill: #B07A3C; }
.mb-chest span { display: inline-flex; align-items: center; gap: 1px; white-space: nowrap; }
.mb-chest .ico-star { width: 13px; height: 13px; fill: var(--sun); }
.mb-chest.is-ready { background: linear-gradient(180deg, #FFE760, #FFB21E); box-shadow: 0 3px 0 #C46A00; animation: chestGlow 1.2s ease-in-out infinite; }
.mb-chest.is-ready > .ico { fill: #8A4B00; }
.mb-chest.is-open { opacity: .65; }
@keyframes chestGlow { 50% { transform: translateY(-2px) scale(1.03); } }
.mb-tags { display: flex; flex-wrap: wrap; gap: 4px; max-height: 44px; overflow: hidden; }
.mb-tag {
  display: inline-flex; align-items: center; gap: 3px; padding: 3px 7px; border-radius: 999px; font-size: 11px; font-weight: 700;
  background: #EFE7FF; color: var(--text-dark); white-space: nowrap;
}
.mb-tag .ico { width: 12px; height: 12px; }
.mb-tag.live { background: #DFFBF6; }
.mb-tag.live .ico { fill: #0FAE9E; }
.mb-tag.soon { background: #F1EDF8; color: var(--muted-dark); }
.mb-tag.item { background: #FFF3C4; }
.mb-lock {
  position: absolute; left: 0; right: 0; top: 0; height: 116px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: rgba(20, 6, 60, .5); font-weight: 800; font-size: 15px; text-align: center; padding: 0 12px; text-shadow: 0 2px 0 var(--ink);
}
.mb-lock .ico { width: 30px; height: 30px; }
.mbanner.is-locked .mb-card { filter: saturate(.55); opacity: .82; }

.map-fab {
  position: absolute; right: max(14px, var(--sar)); bottom: calc(var(--sab) + 16px); z-index: 3;
  display: flex; align-items: center; gap: 6px; padding: 10px 16px 10px 12px; border: 3px solid #fff; border-radius: 999px;
  font: 800 15px/1 var(--font); color: var(--ink); background: linear-gradient(180deg, #FFE760, #FFB21E);
  box-shadow: 0 5px 0 #C46A00, 0 10px 18px rgba(12, 2, 40, .45);
}
.map-fab .ico { width: 22px; height: 22px; color: var(--ink); fill: var(--ink); }
.map-fab:active { transform: translateY(3px); box-shadow: 0 2px 0 #C46A00; }

/* ---------- Yenilik kartı, dünya tanıtımı, ebeveyn kapısı/alanı ---------- */
.feat, .wintro { display: grid; justify-items: center; gap: 8px; text-align: center; }
.feat-art { width: 150px; height: 96px; }
.feat-text { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; }
.feat-note { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted-dark); }
.wintro-art { display: block; width: 100%; max-width: 320px; border-radius: 18px; box-shadow: 0 4px 0 rgba(23, 6, 56, .3); }
.wintro-text { margin: 4px 0 0; font-size: 15.5px; font-weight: 600; line-height: 1.4; }
.wintro-meta { margin: 0; font-size: 13.5px; font-weight: 700; }
.pgate { display: grid; gap: 8px; text-align: center; }
.pg-lead { margin: 0; font-weight: 700; }
.pg-q { margin: 0; font-size: 14.5px; font-weight: 600; display: grid; gap: 4px; }
.pg-q b { font-size: 19px; color: var(--ink); }
.pg-display {
  margin: 2px auto 4px; min-width: 120px; padding: 8px 14px; border-radius: 14px; font: 800 26px/1 var(--font);
  letter-spacing: .12em; color: var(--ink); background: var(--paper-line); font-variant-numeric: tabular-nums;
}
.pg-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: min(100%, 270px); margin: 0 auto; }
.pg-key {
  min-height: 46px; border: 0; border-radius: 14px; font: 800 20px/1 var(--font); color: var(--ink);
  background: linear-gradient(180deg, #fff, #EDE4FF); box-shadow: 0 3px 0 #B9A6E8;
}
.pg-key:active { transform: translateY(2px); box-shadow: 0 1px 0 #B9A6E8; }
.pg-key.is-ok { font-size: 15px; color: #fff; background: linear-gradient(180deg, #3CEBD4, #0FAE9E); box-shadow: 0 3px 0 #087A6A; }
.pg-key.is-del { font-size: 18px; }
.pg-key:disabled { opacity: .45; }
.pg-msg { margin: 0; min-height: 1.3em; font-size: 13.5px; font-weight: 700; color: #C2410C; }
.parents { display: grid; gap: 10px; text-align: left; }
.par-sec { padding: 10px 12px; border-radius: 16px; background: var(--paper-line); }
.par-sec h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 15px; }
.par-sec h4 .ico { width: 20px; height: 20px; fill: var(--ink); }
.par-sec p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.35; }
.par-list { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.45; }
.par-status { font-weight: 700; }
.par-buy { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.par-buy .link-btn:disabled { opacity: .5; }
.win-milestone {
  display: grid; gap: 3px; margin-top: 8px; padding: 9px 12px; border-radius: 16px; text-align: center;
  background: linear-gradient(180deg, #FFF6C9, #FFE59A); color: var(--text-dark); font-size: 13.5px;
}
.win-milestone b { font-size: 15px; }

.collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.mon-card {
  display: flex; flex-direction: column; align-items: center; padding: 10px 12px 14px; border-radius: 22px; color: var(--text-dark);
  background: linear-gradient(180deg, var(--paper), var(--paper-2)); box-shadow: 0 5px 0 #A98BE8, 0 12px 20px rgba(10, 0, 40, .35);
}
.mon-art { width: 120px; height: 110px; }
.mon-info { width: 100%; text-align: center; }
.mon-info h3 { margin: 2px 0 0; font-size: 19px; color: var(--ink); }
.mon-title { margin: 1px 0 6px; font-size: 13px; font-weight: 700; color: #A3165C; }
.mon-bio { margin: 0 0 8px; font-size: 13px; line-height: 1.35; font-weight: 500; color: var(--muted-dark); }
.mon-count { display: inline-flex; align-items: center; gap: 5px; margin: 0; font-size: 13px; font-weight: 600; background: #EFE6FF; padding: 5px 10px; border-radius: 999px; }
.mon-count .ico { width: 18px; height: 18px; color: var(--ink); fill: #A262F2; }
.mon-card.is-locked .mon-title { color: var(--muted-dark); }

/* ---------- Oyun ekranı ---------- */
.pause-btn { position: absolute; top: calc(var(--sat) + 17px); right: 12px; z-index: 5; }

.tut { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.tut-text {
  position: absolute; left: 50%; top: 40%; width: min(88%, 340px); transform: translateX(-50%);
  padding: 13px 16px; border-radius: 20px; text-align: center;
  font: 700 16px/1.35 var(--font); color: var(--ink); background: #fff;
  box-shadow: 0 6px 0 #B9A2E8, 0 14px 30px rgba(10, 0, 40, .45);
  animation: tutIn .35s cubic-bezier(.2, 1.4, .4, 1);
}
@keyframes tutIn { from { transform: translateX(-50%) scale(.85); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
.tut-hand {
  position: absolute; left: 0; top: 0; width: 48px; height: 48px; opacity: 0;
  transform-origin: 19.5px 4.5px; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .35)); will-change: transform, opacity;
}
.tut-hand svg { width: 100%; height: 100%; display: block; }
.tut-skip {
  /* Aşama 5 denetimi: dokunma hedefi en az 44 × 44 px (önceden 36 px yüksekti) */
  position: absolute; right: 14px; bottom: calc(var(--sab) + 12px); min-height: 44px; min-width: 64px; padding: 9px 20px; border-radius: 999px;
  font: 700 14px/1 var(--font); color: #fff; background: rgba(24, 8, 70, .78); border: 2px solid rgba(255, 255, 255, .32);
}

/* ---------- Modal ---------- */
.modal-layer {
  position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: calc(var(--sat) + 34px) 16px calc(var(--sab) + 16px);
}
.modal-backdrop {
  position: absolute; inset: 0; background: rgba(12, 3, 40, .64); opacity: 0; transition: opacity .2s ease;
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.modal {
  --r1: #BE95FF; --r2: #8649E8; --r3: #5A25B0;
  position: relative; width: min(100%, 390px); min-width: 0; max-height: 100%; display: flex; flex-direction: column;
  padding: 44px 18px 18px; border-radius: 28px; color: var(--text-dark);
  background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  box-shadow: 0 8px 0 #B9A2E8, 0 24px 60px rgba(8, 0, 30, .6);
  opacity: 0; transform: translateY(26px) scale(.9);
  transition: transform .3s cubic-bezier(.2, 1.25, .4, 1), opacity .18s ease;
}
.modal-layer.is-open .modal-backdrop { opacity: 1; }
.modal-layer.is-open .modal { opacity: 1; transform: none; }
.modal-ribbon {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%); z-index: 1;
  min-width: 64%; max-width: 94%; padding: 12px 26px; border-radius: 18px; text-align: center; white-space: nowrap;
  font: 800 23px/1.1 var(--font); color: #fff;
  background: linear-gradient(180deg, var(--r1), var(--r2));
  box-shadow: 0 5px 0 var(--r3), 0 10px 20px rgba(10, 0, 40, .35), inset 0 2px 0 rgba(255, 255, 255, .55);
  text-shadow: 0 2px 0 var(--r3), 2px 0 0 var(--r3), -2px 0 0 var(--r3), 0 -2px 0 var(--r3), 0 3px 0 var(--r3);
}
.modal-ribbon::before, .modal-ribbon::after {
  content: ""; position: absolute; top: 14px; width: 22px; height: 30px; z-index: -1; background: var(--r3);
}
.modal-ribbon::before { left: -12px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 45% 50%); }
.modal-ribbon::after { right: -12px; clip-path: polygon(0 0, 100% 0, 55% 50%, 100% 100%, 0 100%); }
.modal-close { position: absolute; top: 10px; right: 10px; z-index: 2; }
.tone-purple { --r1: #BE95FF; --r2: #8649E8; --r3: #5A25B0; }
.tone-yellow { --r1: #FFE760; --r2: #FFAE1A; --r3: #C46A00; }
.tone-coral { --r1: #FFA982; --r2: #F0603A; --r3: #B33A1C; }
.tone-teal { --r1: #3CEBD4; --r2: #0FAE9E; --r3: #087A6A; }
.tone-pink { --r1: #FF92C8; --r2: #F0479A; --r3: #B21F68; }
.modal-body { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 2px; font-size: 16px; line-height: 1.45; }
.modal-body p { margin: 0 0 10px; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.modal-actions .btn { flex: 1 1 auto; min-width: 0; padding-left: 14px; padding-right: 14px; font-size: 17px; }
.modal-actions .btn-icon { flex: 0 0 56px; }
.actions-stack .modal-actions { flex-direction: column; gap: 12px; }
.actions-stack .modal-actions .btn { width: 100%; flex: none; }
.btn-light { --c1: #FFFFFF; --c2: #E7DAFF; --edge: #A98BE8; --tx: transparent; color: var(--ink); text-shadow: none; }
.btn-light .ico { filter: none; }
.muted { color: var(--muted-dark); font-size: 14px; }

/* ayarlar */
.settings { display: grid; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 2px solid var(--paper-line); }
.set-row > .ico { width: 30px; height: 30px; color: #6A2FC4; fill: #8649E8; }
.set-label { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; color: var(--ink); }
.set-label small { display: block; margin-top: 2px; font-weight: 500; font-size: 12.5px; line-height: 1.3; color: var(--muted-dark); }
.set-row.is-disabled .ico, .set-row.is-disabled .set-label { opacity: .7; }
.switch {
  position: relative; flex: none; width: 58px; height: 34px; padding: 0; border: 0; border-radius: 999px;
  background: #D7CBEF; box-shadow: inset 0 3px 0 rgba(0, 0, 0, .1); transition: background .2s ease;
}
.switch i {
  position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 0 rgba(43, 18, 96, .25); transition: transform .22s cubic-bezier(.3, 1.4, .5, 1);
}
.switch.on { background: linear-gradient(180deg, #3CF2CB, #12B89E); }
.switch.on i { transform: translateX(24px); }
.switch:disabled { opacity: .5; }
.set-quality { flex-wrap: wrap; }
.set-quality .segmented { flex-basis: 100%; }
.segmented { display: flex; gap: 2px; padding: 3px; border-radius: 14px; background: #E6DBFA; }
.seg {
  flex: 1; padding: 9px 6px; border: 0; border-radius: 11px; background: transparent;
  font: 700 14px/1 var(--font); color: var(--muted-dark);
}
.seg.on { background: #fff; color: var(--ink); box-shadow: 0 2px 0 rgba(43, 18, 96, .15); }
.set-links { display: grid; gap: 6px; margin-top: 12px; }
.link-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; border: 0; border-radius: 14px;
  background: #F1E9FF; color: var(--ink); font: 700 15px/1.2 var(--font); text-align: left;
}
.link-btn .ico { width: 22px; height: 22px; color: #6A2FC4; fill: #8649E8; }
.link-btn:active { background: #E6DBFA; }
.link-btn.danger { color: #9E2F14; background: #FFEDE7; }
.link-btn.danger .ico { fill: #E2512A; }
.set-version { margin: 12px 0 0; text-align: center; font-size: 12.5px; color: var(--muted-dark); }

/* yakında */
.soon { text-align: center; }
.soon-icon {
  display: grid; place-items: center; width: 84px; height: 84px; margin: 4px auto 12px; border-radius: 26px; color: #fff;
  background: linear-gradient(180deg, var(--r1), var(--r2)); box-shadow: 0 5px 0 var(--r3);
}
.soon-icon .ico { width: 46px; height: 46px; fill: #fff; filter: drop-shadow(0 2px 0 var(--r3)); }
.soon-note { font-size: 13px; color: var(--muted-dark); font-weight: 600; }
.soon-lock { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 4px; padding: 5px 12px; border-radius: 999px; background: #F1EDF8; color: var(--ink); font-size: 14px; }
.soon-lock .ico { width: 16px; height: 16px; fill: var(--ink); }

/* duraklat */
.quick-toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.qt {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border: 0; border-radius: 16px;
  background: #EFE6FF; color: var(--muted-dark); font: 700 13px/1 var(--font);
}
.qt .ico { width: 28px; height: 28px; color: #9C8AC9; fill: #9C8AC9; }
.qt.on { background: #DCFFF8; color: #06574C; }
.qt.on .ico { fill: #0FAE9E; color: #0FAE9E; }
.pause-goal { display: grid; gap: 2px; margin: 14px 0 0 !important; text-align: center; }
.pause-goal b { font-size: 18px; color: var(--ink); }
.pause-goal span { font-size: 15px; color: var(--muted-dark); font-weight: 600; }

/* kazandın */
.win { position: relative; }
.win-pofi { position: absolute; left: -10px; top: -26px; width: 72px; height: 78px; pointer-events: none; animation: winPofi 1.1s cubic-bezier(.3, 1.5, .5, 1) .2s both; }
@keyframes winPofi { 0% { transform: translateY(14px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.reduced-motion .win-pofi { animation: none; }
.win-stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 0 6px; }
.win-star { width: 64px; height: 64px; }
.win-star.s1 { width: 84px; height: 84px; margin-bottom: 12px; }
.win-star .ico { width: 100%; height: 100%; fill: #DCD1F2; stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; filter: drop-shadow(0 3px 0 rgba(43, 18, 96, .28)); }
.win-star.on .ico { fill: #FFD23C; animation: starPop .55s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: var(--d); }
@keyframes starPop { 0% { transform: scale(0) rotate(-50deg); fill: #DCD1F2; } 60% { fill: #FFE760; } 100% { transform: none; } }
.win-score { text-align: center; }
.win-score span { display: block; font-size: 13px; font-weight: 700; color: var(--muted-dark); }
.win-score b { display: block; font-size: 42px; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; }
.win-best { text-align: center; font-size: 14px; font-weight: 600; color: var(--muted-dark); }
.tag { display: inline-block; margin-left: 6px; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-style: normal; font-weight: 700; color: #fff; background: var(--gum); }
.win-reward {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: fit-content; margin: 12px auto 0;
  padding: 7px 14px; border-radius: 16px; background: #FFF4C2;
}
.win-reward .ico { width: 28px; height: 28px; fill: #FFC21A; }
.win-reward b { font-size: 22px; color: #A65400; }
.win-reward span { font-size: 14px; font-weight: 700; color: #A65400; }
.win-rescued { margin-top: 12px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted-dark); }
.wr-list { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.wr-item { display: flex; flex-direction: column; align-items: center; color: var(--ink); }
.wr-item canvas { width: 52px; height: 52px; }
.win-end { margin: 12px 0 0 !important; text-align: center; font-weight: 700; color: #A3165C; }

/* kaybettin */
.lose { display: flex; flex-direction: column; align-items: center; text-align: center; }
.lose-art { width: 120px; height: 112px; }
.lose-text { display: grid; gap: 4px; margin: 4px 0 0 !important; }
.lose-text b { font-size: 19px; color: var(--ink); }
.lose-text span { font-size: 15px; color: var(--muted-dark); font-weight: 600; }

/* basılı tut düğmesi */
.hold-btn { overflow: hidden; }
.hold-fill {
  position: absolute; inset: 0; background: rgba(255, 255, 255, .35); transform: scaleX(0); transform-origin: left center; pointer-events: none;
}

/* ---------- Bildirimler ---------- */
.toasts {
  position: absolute; left: 0; right: 0; top: calc(var(--sat) + 74px); z-index: 70;
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; pointer-events: none;
}
.toast {
  max-width: 360px; padding: 10px 16px; border-radius: 16px; text-align: center;
  font: 600 14px/1.35 var(--font); color: #fff; background: rgba(24, 8, 70, .93); border: 2px solid rgba(255, 255, 255, .18);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35); opacity: 0; transform: translateY(-12px); transition: opacity .25s ease, transform .25s ease;
}
.toast.in { opacity: 1; transform: none; }

/* ---------- Yatay telefon uyarısı ---------- */
.rotate-hint {
  position: absolute; inset: 0; z-index: 80; display: none; place-content: center; justify-items: center; gap: 12px;
  padding: 24px; text-align: center; background: rgba(20, 6, 60, .96);
}
.rotate-hint .ico { width: 56px; height: 56px; color: #B4FFF7; fill: #B4FFF7; animation: rot 1.6s ease-in-out infinite; }
.rotate-hint p { margin: 0; font-weight: 700; font-size: 17px; }
.is-landscape-phone .rotate-hint { display: grid; }
@keyframes rot { 0%, 30% { transform: rotate(90deg); } 60%, 100% { transform: rotate(0deg); } }

/* ---------- Kurtarma ekranı ---------- */
.fatal { position: absolute; inset: 0; z-index: 95; display: grid; place-items: center; padding: 24px; background: rgba(12, 3, 40, .85); }
.fatal-card {
  width: min(100%, 360px); padding: 22px; border-radius: 24px; text-align: center; color: var(--text-dark);
  background: linear-gradient(180deg, var(--paper), var(--paper-2));
}
.fatal-card h2 { margin: 0 0 8px; color: var(--ink); }
.fatal-card p { margin: 0 0 16px; }

/* ---------- Ekran boyutuna göre ---------- */
@media (max-height: 760px) {
  .menu-main { gap: 10px; }
  .mascot { height: clamp(100px, 28vh, 230px); }
  .btn-play { min-height: 74px; }
  .bp-label { font-size: 33px; }
  .tile { min-height: 64px; padding: 8px 12px 9px; font-size: 16px; }
  .tile .ico { width: 32px; height: 32px; }
}
@media (max-height: 640px) {
  .menu-main { gap: 8px; padding-bottom: calc(var(--sab) + 8px); }
  .progress-card { padding: 6px 12px 7px; row-gap: 4px; }
  .pc-name { font-size: 14px; }
  .tile { min-height: 54px; font-size: 15px; }
  .tile .ico { width: 28px; height: 28px; }
  .tile-sub { display: none; }
  .tile .ico { grid-row: 1; }
  .btn-play { min-height: 64px; }
  .bp-label { font-size: 30px; }
  .soon-chip { gap: 2px; }                /* yükseklik 44 px kalır (dokunma hedefi) */
  .menu-soon { padding-top: 10px; }
  .mascot { height: clamp(84px, 19vh, 200px); }
}
@media (max-width: 370px) {
  .res-pill { font-size: 15px; padding-right: 10px; }
  .tile { font-size: 14.5px; padding-left: 10px; padding-right: 10px; column-gap: 7px; }
  .soon-chip { font-size: 10.5px; }
  .modal { padding-left: 14px; padding-right: 14px; }
  .modal-actions .btn { padding-left: 12px; padding-right: 12px; font-size: 16px; }
}
@media (min-width: 700px) and (min-height: 700px) {
  :root { --logo-fs: min(7.4vw, 6.3vh, 64px); }
}
@media (min-width: 600px) and (min-height: 900px) {
  .mascot { height: clamp(180px, 32vh, 330px); }
}

/* ---------- Hareket azaltma ---------- */
@media (prefers-reduced-motion: reduce) {
  .logo-ch, .btn-play, .btn-play::before, .lvl.is-current .lvl-bubble, .mnode.is-current .mn-bubble, .map-marker, .mb-chest.is-ready, .splash-bubble { animation: none !important; }
  .screen, .modal { transition-duration: .01s !important; }
}
.reduced-motion .logo-ch, .reduced-motion .btn-play, .reduced-motion .btn-play::before { animation: none !important; }
[data-quality="low"] .logo-ch, [data-quality="low"] .btn-play::before { animation: none; }
/* menü başka ekranın arkasındayken CSS animasyonları da durur (görünmeyen şey çizilmez) */
html:not([data-screen="menu"]) .logo-ch, html:not([data-screen="menu"]) .btn-play, html:not([data-screen="menu"]) .btn-play::before { animation-play-state: paused; }

/* Aşama 4: ebeveyn alanı → cihaz test bilgisi (gerçek cihaz testi için ölçüm) */
.par-dev summary { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; cursor: pointer; list-style: none; }
.par-dev summary::-webkit-details-marker { display: none; }
.par-dev summary::after { content: '▾'; margin-left: auto; opacity: .6; }
.par-dev[open] summary::after { content: '▴'; }
.par-dev summary .ico { width: 20px; height: 20px; fill: var(--ink); }
.par-dev[open] summary { margin-bottom: 6px; }
.par-dev-text {
  width: 100%; box-sizing: border-box; min-height: 9.5em; resize: none; border: 0; border-radius: 10px; padding: 8px;
  font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); background: rgba(255,255,255,.7);
  -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
}

</style>

<div id="app" class="app">
  <canvas id="world" class="world" aria-label="Oyun alanı"></canvas>

  <!-- Yükleniyor -->
  <div id="splash" class="splash" role="status">
    <div class="splash-bubble"></div>
    <p class="splash-text">Baloncuklar şişiriliyor…</p>
  </div>

  <!-- ANA MENÜ -->
  <section id="scr-menu" class="screen screen-menu" data-screen="menu" aria-label="Ana menü">
    <!-- 1. Üst: yıldız ve altın göstergeleri (yalnızca gösterge; satın alma yok) + ayarlar -->
    <header class="topbar">
      <div class="res-pill res-stars" id="menu-stars" role="img" aria-label="Toplam yıldız">
        <svg class="ico ico-star" aria-hidden="true"><use href="#i-star"/></svg><b>0</b>
      </div>
      <div class="res-pill res-coins" id="menu-coins" role="img" aria-label="Altın">
        <svg class="ico ico-coin" aria-hidden="true"><use href="#i-coin"/></svg><b>0</b>
      </div>
      <button class="round-btn" data-action="settings" aria-label="Ayarlar">
        <svg class="ico"><use href="#i-gear"/></svg>
      </button>
    </header>

    <!-- 2. Orta: logo, Pofi ve baloncuk dünyası (arka plan tuvalde: 60-game-engine.js MenuWorld) -->
    <div class="hero">
      <h1 class="logo" id="logo" aria-label="Baloncuk Canavarları">
        <span class="logo-line" data-text="Baloncuk"></span>
        <span class="logo-line" data-text="Canavarları"></span>
      </h1>
      <canvas id="mascot" class="mascot" width="200" height="190" aria-hidden="true"></canvas>
    </div>

    <!-- 3. Merkez: mevcut seviye bilgisi ve OYNA -->
    <div class="menu-main">
      <div class="progress-card" id="menu-progress">
        <span class="pc-world" id="pc-world">Dünya 1</span>
        <span class="pc-name" id="pc-name">Köpük Koyu</span>
        <div class="pc-bar" role="progressbar" aria-label="Dünya ilerlemesi" aria-valuemin="0" aria-valuemax="100" id="pc-bar"><i id="pc-fill"></i></div>
        <span class="pc-done" id="pc-done">0/100</span>
      </div>

      <button class="btn btn-play no-tap-sound" id="btn-play" data-action="play">
        <span class="bp-label">OYNA</span>
        <span class="bp-sub" id="btn-play-sub">Seviye 1</span>
      </button>

      <!-- 4. Alt: çalışan bölümler -->
      <nav class="menu-grid" aria-label="Oyun bölümleri">
        <button class="tile tile-blue no-tap-sound" data-action="levels" data-sfx="soft"><svg class="ico"><use href="#i-map"/></svg><span>Seviyeler</span><small class="tile-sub" id="tile-levels-sub">1-1000</small></button>
        <button class="tile tile-coral no-tap-sound" data-action="collection" data-sfx="soft"><svg class="ico"><use href="#i-monster"/></svg><span>Koleksiyon</span><small class="tile-sub" id="tile-col-sub">0/6</small></button>
      </nav>

      <!-- 5. Henüz hazır olmayan bölümler: küçük, ikincil, kilitli; dokununca nedenini anlatır.
           Hazır olan bölüm bu şeritten çıkarılıp menu-grid'e taşınır (50-ui-manager.js SOON). -->
      <div class="menu-soon" id="menu-soon" role="group" aria-label="Yakında gelecek bölümler">
        <span class="ms-label"><svg class="ico" aria-hidden="true"><use href="#i-lock"/></svg>Yakında geliyor</span>
        <button class="soon-chip no-tap-sound" data-action="soon" data-feature="endless" data-sfx="soft" aria-label="Sonsuz Mod: henüz hazır değil"><svg class="ico"><use href="#i-infinity"/></svg><span>Sonsuz</span></button>
        <button class="soon-chip no-tap-sound" data-action="soon" data-feature="quests" data-sfx="soft" aria-label="Görevler: henüz hazır değil"><svg class="ico"><use href="#i-quests"/></svg><span>Görevler</span></button>
        <button class="soon-chip no-tap-sound" data-action="soon" data-feature="loyalty" data-sfx="soft" aria-label="Ödüller: henüz hazır değil"><svg class="ico"><use href="#i-gift"/></svg><span>Ödüller</span></button>
        <button class="soon-chip no-tap-sound" data-action="soon" data-feature="shop" data-sfx="soft" aria-label="Mağaza: henüz hazır değil"><svg class="ico"><use href="#i-shop"/></svg><span>Mağaza</span></button>
      </div>
    </div>
  </section>

  <!-- SEVİYE SEÇİMİ -->
  <section id="scr-levels" class="screen screen-sub" data-screen="levels" aria-label="Seviyeler">
    <header class="subbar">
      <button class="round-btn" data-action="back" aria-label="Geri"><svg class="ico"><use href="#i-back"/></svg></button>
      <h2>Seviyeler</h2>
      <div class="res-pill res-stars"><svg class="ico ico-star"><use href="#i-star"/></svg><b id="levels-stars">0</b></div>
    </header>
    <div class="map-scroll" id="levels-scroll" tabindex="-1">
      <div class="map-inner" id="map-inner"><div id="levels-list" class="map-layer"></div></div>
    </div>
    <button class="map-fab" id="map-fab" data-action="map-current" hidden><svg class="ico"><use href="#i-up"/></svg><span id="map-fab-label">Seviye 1</span></button>
  </section>

  <!-- KOLEKSİYON -->
  <section id="scr-collection" class="screen screen-sub" data-screen="collection" aria-label="Canavar koleksiyonu">
    <header class="subbar">
      <button class="round-btn" data-action="back" aria-label="Geri"><svg class="ico"><use href="#i-back"/></svg></button>
      <h2>Koleksiyon</h2>
      <div class="res-pill" id="collection-count">0/6</div>
    </header>
    <div class="scroll"><p class="sub-lead">Baloncuklardan kurtardığın canavar arkadaşların burada.</p><div class="collection-grid" id="collection-grid"></div></div>
  </section>

  <!-- OYUN -->
  <section id="scr-game" class="screen screen-game" data-screen="game" aria-label="Oyun">
    <button class="round-btn pause-btn" id="btn-pause" data-action="pause" aria-label="Duraklat"><svg class="ico"><use href="#i-pause"/></svg></button>
    <div id="tut" class="tut" hidden>
      <div class="tut-text" id="tut-text"></div>
      <div class="tut-hand" id="tut-hand" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M26 6c3 0 5 2.2 5 5v15.2l2.4-.4c2.4-.4 4.6 1 5.2 3.2l.2.7 1.8-.3c2.4-.4 4.6 1 5.2 3.3l.1.5 1-.1c3-.4 5.6 2 5.6 5V45c0 7.7-6.3 14-14 14h-5.3c-4.4 0-8.5-2.2-11-5.8L12 40.8c-1.5-2.2-1-5.2 1.1-6.8 2-1.5 4.8-1.3 6.6.5l1.3 1.3V11c0-2.8 2.2-5 5-5z" fill="#fff" stroke="#2B1260" stroke-width="3.2" stroke-linejoin="round"/></svg>
      </div>
      <button class="tut-skip" id="tut-skip" data-action="tut-skip">Geç</button>
    </div>
  </section>

  <!-- MODALLAR -->
  <div id="modal-layer" class="modal-layer" hidden>
    <div class="modal-backdrop" data-action="modal-backdrop"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-ribbon"><span id="modal-title"></span></div>
      <button class="modal-close round-btn small" data-action="modal-close" aria-label="Kapat" hidden><svg class="ico"><use href="#i-close"/></svg></button>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div class="rotate-hint" aria-hidden="true">
    <svg class="ico"><use href="#i-phone-rotate"/></svg>
    <p>Daha rahat oynamak için telefonunu dik tut.</p>
  </div>

    this.shooterY = opts.shooterY || G.SHOOTER_Y;

    this.shotsUsed = 0;

    this.combo = 0;

/* =====================================================================
 * 14 Bot — ekransız otomatik oyuncu (test ve kalibrasyon)
 *
 * Her seviyeyi binlerce kez oynayarak çözülebilirliği, kazanma oranını,
 * ortalama atış sayısını ve başarısızlık noktalarını ölçer. Oyunun gerçek

 *

 * dört strateji profili vardır (PROFILES):
 *   usta      dikkatli oyuncu: küçük nişan hatası, nadiren yanlış hamle
 *   rahat     çocuk / yeni oyuncu: belirgin nişan hatası, sık yanlış hamle
 *   duz       duvardan sektirmeyi ve değiştirmeyi hiç kullanmayan oyuncu

      else if (o.kind === 'color') { if (rem > 0) ctx.color = o.color; ctx.colorNeeded = rem; }

      if (ctx.color && cand.color === ctx.color) v += sim.same * 8;

    if (ctx.rescue && ctx.monstersLeft - sim.rescued > 0) done = false;
    if (ctx.item && ctx.itemsNeeded - sim.items > 0) done = false;
    if (ctx.color && ctx.colorNeeded - sim.colorRemoved > 0) done = false;
    if (ctx.clear && sim.count > 0) done = false;

    // buzlu hedefi (canavar/nesne) çözmek daha değerlidir

        if (opts.noBounce && tr.bounces > 0) continue;
        for (var ci = 0; ci < colors.length; ci++) {
          var key = ci * 100000 + tr.r * 100 + tr.c;
          var e = map[key];
          if (!e) { e = map[key] = { r: tr.r, c: tr.c, ci: ci, color: colors[ci], angles: [], bounces: tr.bounces }; list.push(e); }
          e.angles.push(a);
          if (tr.bounces < e.bounces) e.bounces = tr.bounces;
        }
      }

        // sektirmesiz hiçbir atış yoksa (çok nadir) normal plana dön
        if (opts.noBounce) return Bot.plan(session, { step: opts.step, aimNoise: opts.aimNoise, rng: opts.rng, noSwap: opts.noSwap });

      var q = { goals: ctx.goals, color: ctx.color };

        var cand = list[i];

        // kenarda kalan (çok dar açı aralığıyla ulaşılan) hücreleri hafifçe cezalandır
        cand.value = evaluate(sim, cand, ctx) - (cand.angles.length < 2 ? 15 : 0);
      }
      list.sort(function (x, y) { return y.value - x.value; });
      var pick = list[0];
      if (opts.random && rng() < opts.random) pick = list[Math.floor(rng() * list.length)];
      else if (opts.blunder && rng() < opts.blunder) pick = list[Math.floor(rng() * Math.min(list.length, 6))];

      if (opts.aimNoise) {

/* =====================================================================
 * 21 RewardManager — seviye sonuçları, yıldızlar, ilk tamamlama ödülü
 *
 * Puan (skor), yıldız ve oyun içi para (altın) ayrı sistemlerdir:
 *   - skor: seviye içinde; en iyisi seviye kaydında (b)
 *   - yıldız: seviye başına en iyi (s, 0..3); toplam = ilerleme göstergesi
 *   - altın: cüzdanda; seviye ödülü YALNIZCA ilk tamamlamada verilir (r bayrağı)
 * Tüm değişiklikler tek SaveManager.update() içinde, birlikte yapılır.
 *
 * Aşama 3: dünya yıldız sandıkları (her dünyada 3 sandık; yıldız hedefine
 * ulaşınca bir kez açılır), toplanan dünya nesneleri (inci, şeker…).
 * ===================================================================== */
(function (root) {
  'use strict';
  var BC = root.BC;

  function rec(d, n) {
    var k = String(n);
    if (!d.progress.levels[k]) d.progress.levels[k] = { s: 0, b: 0, c: 0, p: 0, r: false };
    return d.progress.levels[k];
  }

    record: function (n) {

    },
    isUnlocked: function (n) {
      return n >= 1 && n <= BC.SaveManager.data.progress.unlocked;
    },
    /** Oyuncunun sıradaki (OYNA ile açılacak) seviyesi */
    currentLevel: function () {
      var u = BC.SaveManager.data.progress.unlocked;
      return Math.max(1, Math.min(u, BC.LevelManager.count()));
    },
    totalStars: function () {
      var lv = BC.SaveManager.data.progress.levels, sum = 0;
      Object.keys(lv).forEach(function (k) { sum += lv[k].s || 0; });
      return sum;
    },
    completedCount: function () {
      var lv = BC.SaveManager.data.progress.levels, n = 0;
      Object.keys(lv).forEach(function (k) {
        if (lv[k].c > 0 && Number(k) <= BC.LevelManager.count()) n++;

    recordWin: function (n, r) {

        var stars = Math.max(1, Math.min(3, r.stars | 0));

          out.coins = level ? level.reward.coins : 0;
          d.wallet.coins += out.coins;
        }

      d.stats.dropped += s.dropped || 0;

      d.stats.shots += r.shots || 0;

        var item = BC.worldOf(r.level).item.id;

      }

        r.objectives.forEach(function (o) {
          if (o.kind === 'color') d.stats.colorBubbles += Math.max(0, Math.min(o.total, o.total - o.remaining));
        });
      }
      if ((r.bestCombo || 0) > d.stats.bestCombo) d.stats.bestCombo = r.bestCombo;

        Object.keys(r.rescued).forEach(function (id) {

    worldStars: function (worldId) {

      Object.keys(lv).forEach(function (k) {

        d.progress.chests[k] = (d.progress.chests[k] || 0) | (1 << i);
        d.wallet.coins += c.coins;
      });
      BC.SaveManager.flush();
      return c.coins;
    },

    addPlayTime: function (ms) {
      if (!(ms > 0)) return;
      BC.SaveManager.update(function (d) { d.stats.playMs += Math.round(ms); });
    }
  };

  BC.RewardManager = RewardManager;
})(typeof window !== 'undefined' ? window : globalThis);

    var cy = baseY - hgt, pr = hgt * 0.14;
    var glow = ctx.createRadialGradient(x, cy, 0, x, cy, pr * 3.2);
    glow.addColorStop(0, Gfx.hexA(col, 0.45));
    glow.addColorStop(1, Gfx.hexA(col, 0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, cy, pr * 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = col;
    for (var i = 0; i < 5; i++) {
      var a = i / 5 * TAU;
      ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * pr, cy + Math.sin(a) * pr, pr * 0.9, pr * 0.55, a, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(x, cy, pr * 0.5, 0, TAU); ctx.fill();
  }

  function gear(ctx, x, y, r, teeth, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    for (var i = 0; i < teeth * 2; i++) {
      var a = i / (teeth * 2) * TAU, rr = i % 2 === 0 ? r : r * 0.78;
      var a2 = (i + 1) / (teeth * 2) * TAU;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      ctx.lineTo(x + Math.cos(a2) * rr, y + Math.sin(a2) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.arc(x, y, r * 0.32, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = Math.max(1, r * 0.06);
    ctx.beginPath(); ctx.arc(x, y, r * 0.6, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
  }

  function toyBlock(ctx, x, y, s, col, letter) {
    ctx.fillStyle = col;
    Gfx.roundRect(ctx, x - s / 2, y - s, s, s, s * 0.14); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '700 ' + Math.round(s * 0.62) + 'px ' + Gfx.FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(letter, x, y - s / 2 + 1);
  }

  function ferris(ctx, cx, cy, r, cols) {
    ctx.strokeStyle = 'rgba(255, 230, 250, 0.55)';
    ctx.lineWidth = Math.max(2, r * 0.05);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - r * 0.55, cy + r * 1.25); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * 0.55, cy + r * 1.25); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    for (var i = 0; i < 8; i++) {
      var a = i / 8 * TAU;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
      ctx.fillStyle = cols[i % cols.length];
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r + r * 0.1, r * 0.12, 0, TAU); ctx.fill();
    }
  }

  function crystalSpire(ctx, x, baseY, hgt, w, col) {
    var g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, Gfx.hexA(col, 0.85));
    g.addColorStop(0.5, 'rgba(255,255,255,0.9)');
    g.addColorStop(1, Gfx.hexA(col, 0.6));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, baseY); ctx.lineTo(x - w / 2, baseY - hgt * 0.78); ctx.lineTo(x, baseY - hgt);
    ctx.lineTo(x + w / 2, baseY - hgt * 0.78); ctx.lineTo(x + w / 2, baseY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, baseY - hgt); ctx.lineTo(x, baseY); ctx.stroke();
  }

  function starField(ctx, w, h, rng, n) {
    for (var i = 0; i < n; i++) {
      var x = rng() * w, y = rng() * h * 0.6, r = rng.range(0.6, 1.8);
      ctx.fillStyle = 'rgba(255,255,255,' + rng.range(0.35, 0.9).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      if (r > 1.5) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(x - r * 3, y); ctx.lineTo(x + r * 3, y); ctx.moveTo(x, y - r * 3); ctx.lineTo(x, y + r * 3); ctx.stroke();
      }
    }
  }

  function crescent(ctx, x, y, r, sky) {
    ctx.fillStyle = 'rgba(255, 246, 214, 0.95)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = sky;
    ctx.beginPath(); ctx.arc(x + r * 0.42, y - r * 0.18, r * 0.86, 0, TAU); ctx.fill();
  }

  function snowfall(ctx, w, h, rng) {
    for (var i = 0; i < 46; i++) {
      ctx.fillStyle = 'rgba(255,255,255,' + rng.range(0.35, 0.85).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(rng() * w, rng() * h * 0.8, rng.range(1, 2.8), 0, TAU); ctx.fill();
    }
  }

  /** Temanın gökyüzü ayrıntıları (tepelerden önce çizilir) */
  function paintSkyExtras(ctx, th, w, h, rng) {
    switch (th.decor) {
      case 'flowers': starField(ctx, w, h, rng, 90); crescent(ctx, w * 0.84, h * 0.12, Math.min(w, h) * 0.06, th.sky[0]); break;
      case 'ferris': starField(ctx, w, h, rng, 60); crescent(ctx, w * 0.16, h * 0.1, Math.min(w, h) * 0.07, th.sky[0]); break;
      case 'crystals': starField(ctx, w, h, rng, 50); break;
      case 'pines': snowfall(ctx, w, h, rng); break;
      case 'cacti': rainbow(ctx, w * 0.5, h * 0.78, Math.min(w * 0.7, h * 0.6), 0.22); break;
      case 'houses': cloudPuff(ctx, w * 0.2, h * 0.22, Math.min(w, h) * 0.07, 'rgba(255,255,255,0.35)');
        cloudPuff(ctx, w * 0.78, h * 0.32, Math.min(w, h) * 0.09, 'rgba(255,255,255,0.3)'); break;
      case 'gears': gear(ctx, w * 0.88, h * 0.16, Math.min(w, h) * 0.07, 10, 'rgba(255,255,255,0.12)');
        gear(ctx, w * 0.1, h * 0.3, Math.min(w, h) * 0.05, 8, 'rgba(255,255,255,0.1)'); break;
      default: break;
    }
  }

  /**
   * Temanın kenar süslemeleri. Sol ve sağ kenarlara yerleşir; dar ekranda
   * yarı saydam oyun panelinin arkasında kalır, geniş ekranda görünür.
   */
  function paintDecor(ctx, th, w, h, baseY, rng) {
    var dc = th.decorColors;
    var u = Math.max(0.8, Math.min(1.6, w / 420));     // boyut ölçeği
    var L = [0.04, 0.1, 0.16], R = [0.96, 0.9, 0.84];
    var xs = L.concat(R);
    switch (th.decor) {
      case 'candy':
        xs.forEach(function (fx, i) {
          if (i % 3 === 1) candyCane(ctx, w * fx, baseY + 6, 70 * u, dc[0]);
          else lollipop(ctx, w * fx, baseY + 6, (80 + (i % 2) * 30) * u, dc[i % 3]);
        });
        break;
      case 'pines':
        xs.forEach(function (fx, i) { pine(ctx, w * fx, baseY + 10, (90 + (i % 3) * 26) * u, dc[i % 2], dc[2]); });
        break;
      case 'coral':
        xs.forEach(function (fx, i) {
          coralBranch(ctx, w * fx, baseY + 10, 26 * u, -Math.PI / 2 + rng.range(-0.2, 0.2), 9 * u, Gfx.hexA(dc[i % 3], 0.8), 3, rng);
        });
        shell(ctx, w * 0.12, baseY + 14, 18 * u, '#FFD6B8');
        shell(ctx, w * 0.88, baseY + 16, 16 * u, '#FFC2D8');
        break;
      case 'houses':
        house(ctx, w * 0.08, baseY, 48 * u, dc[0]);
        house(ctx, w * 0.92, baseY - 6, 54 * u, dc[1]);
        house(ctx, w * 0.17, baseY + 14, 34 * u, dc[2]);
        house(ctx, w * 0.83, baseY + 12, 36 * u, dc[0]);
        break;
      case 'cacti':
        xs.forEach(function (fx, i) { cactus(ctx, w * fx, baseY + 10, (60 + (i % 3) * 22) * u, dc[i % 2]); });
        break;
      case 'flowers':
        xs.forEach(function (fx, i) { flower(ctx, w * fx, baseY + 10, (60 + (i % 3) * 20) * u, dc[i % 3]); });
        break;
      case 'gears':
        gear(ctx, w * 0.06, baseY - 30 * u, 34 * u, 10, Gfx.hexA(dc[0], 0.85));
        gear(ctx, w * 0.15, baseY - 4 * u, 22 * u, 8, Gfx.hexA(dc[2], 0.85));
        gear(ctx, w * 0.94, baseY - 36 * u, 38 * u, 11, Gfx.hexA(dc[1], 0.85));
        toyBlock(ctx, w * 0.84, baseY + 12, 26 * u, dc[0], 'A');
        toyBlock(ctx, w * 0.9, baseY + 12, 26 * u, dc[2], 'B');
        toyBlock(ctx, w * 0.87, baseY - 14 * u, 26 * u, dc[1], 'C');
        break;
      case 'ferris':
        ferris(ctx, w * 0.9, baseY - 70 * u, 58 * u, dc);
        xs.slice(0, 3).forEach(function (fx, i) {
          // ışık zinciri
          ctx.fillStyle = dc[i % 3];
          for (var k = 0; k < 6; k++) {
            ctx.beginPath(); ctx.arc(w * fx + k * 9 * u - 22 * u, baseY - 40 * u - Math.sin(k / 5 * Math.PI) * 10 * u + i * 16 * u, 3 * u, 0, TAU); ctx.fill();
          }
        });
        break;
      case 'crystals':
        xs.forEach(function (fx, i) { crystalSpire(ctx, w * fx, baseY + 12, (70 + (i % 3) * 30) * u, 22 * u, dc[i % 3]); });
        break;
      default: // seaweed (Köpük Koyu)
        [[0.04, 0.16, 0], [0.1, 0.11, 1], [0.92, 0.15, 2], [0.97, 0.1, 0], [0.86, 0.08, 1]].forEach(function (s, idx) {
          seaweed(ctx, w * s[0], baseY + 8, h * s[1], Gfx.hexA(dc[s[2]], 0.55), 14 + idx * 3, Math.max(6, w * 0.018));
        });
        shell(ctx, w * 0.14, baseY + 18, 14 * u, '#FFE3EC');
        break;
    }
  }

  /** Statik sahneyi çizer. opts.panel: {x,y,w,h} oyun alanı (CSS px) */
  function paintScene(themeKey, w, h, dpr, opts) {
    opts = opts || {};
    var th = BC.THEMES[themeKey] || BC.THEMES.lagoon;
    var c = Gfx.makeCanvas(w * dpr, h * dpr);
    var ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    var rng = BC.RNG(opts.seed || 7);

    // gökyüzü
    var g = ctx.createLinearGradient(0, 0, 0, h);
    th.sky.forEach(function (col, i) { g.addColorStop(th.skyStops[i], col); });
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // büyük yumuşak ışık
    var gl = ctx.createRadialGradient(w * 0.78, h * 0.1, 0, w * 0.78, h * 0.1, Math.max(w, h) * 0.55);
    gl.addColorStop(0, th.glow);
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(0, 0, w, h);

    // ışık huzmeleri
    ctx.save();
    for (var i = 0; i < 5; i++) {
      var x0 = w * (0.12 + i * 0.2) + rng.range(-20, 20);
      var rw = w * rng.range(0.05, 0.11);
      var lg = ctx.createLinearGradient(0, 0, 0, h * 0.75);
      lg.addColorStop(0, 'rgba(255,255,255,0.075)');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(x0, -10);
      ctx.lineTo(x0 + rw, -10);
      ctx.lineTo(x0 + rw * 2.6 + w * 0.12, h * 0.75);
      ctx.lineTo(x0 + rw * 0.4 + w * 0.12, h * 0.75);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    paintSkyExtras(ctx, th, w, h, rng);

    // bokeh baloncukları
    for (var b = 0; b < 26; b++) {
      var bx = rng() * w, by = rng() * h * 0.85, br = rng.range(8, 46) * (w / 400 > 1.4 ? 1.4 : Math.max(0.8, w / 400));
      var col = th.bokeh[b % th.bokeh.length];
      var bg = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.3, 0, bx, by, br);
      bg.addColorStop(0, col);
      bg.addColorStop(0.7, col.replace(/[\d.]+\)$/, '0.04)'));
      bg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // tepeler
    ctx.fillStyle = th.hillBack;
    ctx.globalAlpha = 0.75;
    wave(ctx, w, h, h * 0.74, h * 0.025, 3, 0.4);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = th.hillEdge;
    ctx.lineWidth = 2;
    ctx.stroke();

    // dünyaya özgü kenar süslemeleri (yosun, lolipop, çam, mercan, ev, kaktüs…)
    var baseY = h * 0.86;
    paintDecor(ctx, th, w, h, baseY, rng);

    ctx.fillStyle = th.hillMid;
    wave(ctx, w, h, h * 0.84, h * 0.02, 2.2, 1.9);
    ctx.fill();
    ctx.strokeStyle = th.hillEdge;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = th.hillFront;
    wave(ctx, w, h, h * 0.93, h * 0.015, 2.6, 3.1);
    ctx.fill();

    // küçük parıltılar
    for (var s2 = 0; s2 < 40; s2++) {
      ctx.fillStyle = 'rgba(255,255,255,' + rng.range(0.15, 0.5).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(rng() * w, rng() * h * 0.7, rng.range(0.6, 1.6), 0, Math.PI * 2);
      ctx.fill();
    }

    // vinyet
    var vg = ctx.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.35, w / 2, h * 0.5, Math.max(w, h) * 0.8);
    vg.addColorStop(0, 'rgba(10,0,40,0)');
    vg.addColorStop(1, 'rgba(10,0,40,0.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, w, h);

    if (opts.panel) paintPanel(ctx, th, opts.panel);
    return c;
  }

  /** Oyun alanı paneli: cam zemin, köpük tavan, yan duvar parıltıları, fırlatıcı adası */
  function paintPanel(ctx, th, p) {
    var k = p.k;                 // CSS px / mantıksal birim
    var x = p.x, y = p.y, w = p.w, h = p.h;
    // cam panel
    ctx.save();
    Gfx.roundRect(ctx, x - 6, y - 6, w + 12, h + 12, 22);
    ctx.fillStyle = th.panel;
    ctx.fill();
    ctx.strokeStyle = th.panelEdge;
    ctx.lineWidth = 2;
    ctx.stroke();
    // üst iç parlama
    var ig = ctx.createLinearGradient(0, y, 0, y + h * 0.3);
    ig.addColorStop(0, 'rgba(255,255,255,0.08)');
    ig.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = ig;
    Gfx.roundRect(ctx, x - 4, y - 4, w + 8, h * 0.3, 20);
    ctx.fill();
    ctx.restore();

    // yan duvar çizgileri (sekme yüzeyleri)
    ctx.save();
    ['left', 'right'].forEach(function (side) {
      var wx = side === 'left' ? x - 2 : x + w + 2;
      var lg = ctx.createLinearGradient(0, y, 0, y + h);
      lg.addColorStop(0, 'rgba(180,255,247,0.45)');
      lg.addColorStop(1, 'rgba(180,255,247,0.06)');
      ctx.strokeStyle = lg;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(wx, y + 10);
      ctx.lineTo(wx, y + h - 8);
      ctx.stroke();
    });
    ctx.restore();

    // köpük tavan
    ctx.save();
    var rng = BC.RNG(42);
    var foamY = y - 4;
    var fg = ctx.createLinearGradient(0, foamY - 14 * k, 0, foamY + 10 * k);
    fg.addColorStop(0, th.foam ? th.foam[0] : '#FFFFFF');
    fg.addColorStop(1, th.foam ? th.foam[1] : '#BDF4F0');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.rect(x - 6, y - 26, w + 12, 22);
    ctx.fill();
    for (var i = 0; i <= 22; i++) {
      var fx = x - 6 + (w + 12) * (i / 22);
      var fr = (7 + rng() * 6) * k;
      ctx.beginPath();
      ctx.arc(fx, foamY + rng.range(-2, 3) * k, fr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (var j = 0; j < 14; j++) {
      ctx.beginPath();
      ctx.arc(x + rng() * w, foamY - rng.range(2, 10) * k, rng.range(1, 3) * k, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // fırlatıcı adası
    var sx = x + w / 2, sy = y + p.shooterY;
    ctx.save();
    var ig2 = ctx.createRadialGradient(sx, sy + 30 * k, 4, sx, sy + 30 * k, 150 * k);
    ig2.addColorStop(0, 'rgba(180,255,247,0.28)');
    ig2.addColorStop(1, 'rgba(180,255,247,0)');
    ctx.fillStyle = ig2;
    ctx.fillRect(sx - 160 * k, sy - 60 * k, 320 * k, 200 * k);
    ctx.fillStyle = th.ground[0];
    ctx.beginPath();
    ctx.ellipse(sx, sy + 42 * k, 150 * k, 22 * k, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = th.ground[1];
    ctx.beginPath();
    ctx.ellipse(sx, sy + 48 * k, 140 * k, 16 * k, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- Ortam baloncukları (her karede) ---------- */
  function soapSprite(px) {
    var c = Gfx.makeCanvas(px, px);
    var ctx = c.getContext('2d');
    var r = px / 2;
    var g = ctx.createRadialGradient(r, r, r * 0.6, r, r, r);
    g.addColorStop(0, 'rgba(255,255,255,0.02)');
    g.addColorStop(0.85, 'rgba(200,255,250,0.18)');
    g.addColorStop(1, 'rgba(255,255,255,0.45)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(r, r, r - 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.ellipse(r * 0.62, r * 0.55, r * 0.22, r * 0.12, -0.7, 0, Math.PI * 2);
    ctx.fill();
    return c;
  }

  function Ambient(count) {
    this.items = [];
    this.sprite = null;
    this.w = 1; this.h = 1;
    this.setCount(count);
  }
  Ambient.prototype.setCount = function (n) {
    while (this.items.length < n) this.items.push({ x: 0, y: 0, r: 0, v: 0, ph: 0, a: 0 });
    this.items.length = n;
    this._seeded = false;
  };
  Ambient.prototype.resize = function (w, h, dpr) {
    this.w = w; this.h = h;
    this.sprite = soapSprite(Math.ceil(64 * Math.min(2, dpr)));
    this._seeded = false;
  };
  Ambient.prototype._reset = function (b, initial) {
    b.r = 5 + Math.random() * 16;
    b.x = Math.random() * this.w;
    b.y = initial ? Math.random() * this.h : this.h + b.r + Math.random() * 60;
    b.v = 14 + Math.random() * 26;
    b.ph = Math.random() * 6.28;
    b.a = 0.35 + Math.random() * 0.5;
  };
  Ambient.prototype.update = function (dt, t) {
    if (!this._seeded) { for (var i = 0; i < this.items.length; i++) this._reset(this.items[i], true); this._seeded = true; }
    for (var j = 0; j < this.items.length; j++) {
      var b = this.items[j];
      b.y -= b.v * dt;
      b.x += Math.sin(t * 0.9 + b.ph) * 10 * dt;
      if (b.y < -b.r * 2) this._reset(b, false);
    }
  };
  Ambient.prototype.draw = function (ctx, alpha) {
    if (!this.sprite) return;
    for (var i = 0; i < this.items.length; i++) {
      var b = this.items[i];
      ctx.globalAlpha = b.a * (alpha === undefined ? 1 : alpha);
      ctx.drawImage(this.sprite, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    ctx.globalAlpha = 1;
  };

  BC.Background = {
    paintScene: paintScene,
    /** Harita için küçük dünya manzarası (yalnızca gökyüzü + süsleme + tepeler) */
    paintVignette: function (themeKey, w, h, dpr) {
      var th = BC.THEMES[themeKey] || BC.THEMES.lagoon;
      var c = Gfx.makeCanvas(Math.round(w * dpr), Math.round(h * dpr));
      var ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      var rng = BC.RNG(11);
      var g = ctx.createLinearGradient(0, 0, 0, h);
      th.sky.forEach(function (col, i) { g.addColorStop(th.skyStops[i], col); });
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      paintSkyExtras(ctx, th, w, h, rng);
      // yumuşak baloncuklar (her temada)
      for (var b = 0; b < 9; b++) {
        var bx = rng() * w, by = rng() * h * 0.7, br = rng.range(6, 18);
        var col = th.bokeh[b % th.bokeh.length];
        ctx.fillStyle = col;
