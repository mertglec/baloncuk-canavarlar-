    this.paused = false;
    this.lockT = 0;
    this.launcher.loadT = 1; this.launcher.swapT = 0; this.launcher.nextPopT = 1; this.launcher.recolorT = 0;
    this.mascot.expr = 'idle'; this.mascot.exprT = 0; this.mascot.dance = false; this.mascot.jump = 0;
    this.goalMonster = this._pickGoalMonster();
    this.startedAt = Date.now();
    this.intro = { t: 0, dur: 0.95 };
    this.phase = 'intro';
    var goalText = STR.goalText(this.session.objectiveStatus(), this.worldItem);
    this.banner = { title: STR.levelN(levelN), sub: goalText, t: 0, dur: 2.1, kind: 'intro' };
    this._paintBg();
    BC.Audio.play('whoosh');
    BC.events.emit('game:start', { level: levelN });
  };

  GameView.prototype._pickGoalMonster = function () {
    var counts = {}, best = null;
    this.session.board.forEach(function (b) {
      if (b.kind === 'monster') counts[b.monster] = (counts[b.monster] || 0) + 1;
    });
    Object.keys(counts).forEach(function (k) { if (!best || counts[k] > counts[best]) best = k; });
    return best || 'pofi';
  };

  /* ===================== Giriş (dokunmatik/fare) ===================== */
  GameView.prototype.pointerDown = function (id, cx, cy) {
    if (this.paused || !this.session) return;
    if (this.phase === 'winseq') { this._skipWin(); return; }
    if (this.banner && this.banner.kind === 'intro' && this.banner.t < this.banner.dur - 0.25) this.banner.t = this.banner.dur - 0.25;
    if (this.phase === 'intro' && this.intro && this.intro.t > 0.3) this._endIntro();
    if (this.phase !== 'play' || this.aim.pointerId !== null) return;
    var p = this.toBoard(cx, cy);
    var lp = this.launcherPos(), np = this.nextPos();
    this.aim.pointerId = id;
    this.aim.sx = cx; this.aim.sy = cy;
    if (U.dist(p.x, p.y, np.x, np.y) < 34 || U.dist(p.x, p.y, lp.x, lp.y) < 30) {
      this.aim.swapTap = true;
      return;
    }
    this.aim.swapTap = false;
    this.aim.active = true;
    this._updateAim(p.x, p.y);
    BC.events.emit('game:aimStart');
  };

  GameView.prototype.pointerMove = function (id, cx, cy) {
    if (id !== this.aim.pointerId) return;
    if (this.aim.swapTap) {
      if (U.dist(cx, cy, this.aim.sx, this.aim.sy) < 16) return;
      this.aim.swapTap = false;
      this.aim.active = true;
      BC.events.emit('game:aimStart');
    }
    if (!this.aim.active) return;
    var p = this.toBoard(cx, cy);
    this._updateAim(p.x, p.y);
  };

  GameView.prototype.pointerUp = function (id, cx, cy) {
    if (id !== this.aim.pointerId) return;
    var wasSwap = this.aim.swapTap, wasAim = this.aim.active && this.aim.valid;
    this.aim.pointerId = null;
    this.aim.active = false;
    this.aim.swapTap = false;
    if (this.phase !== 'play' || this.paused) { this.aim.trace = null; return; }
    if (wasSwap) { this.swap(); return; }
    if (wasAim) this.fire(this.aim.angle);
    this.aim.trace = null;
  };

  GameView.prototype.pointerCancel = function () {
    this.aim.pointerId = null;
    this.aim.active = false;
    this.aim.swapTap = false;
    this.aim.trace = null;
  };

  GameView.prototype._updateAim = function (x, y) {
    var lp = this.launcherPos();
    if (y > lp.y + 26) {               // fırlatıcının altına inilirse atış iptal
      this.aim.valid = false;
      this.aim.trace = null;
      return;
    }
    var ang = Math.atan2(Math.max(lp.y - y, 0.5), x - lp.x);
    ang = U.clamp(ang, G.MIN_ANGLE, G.MAX_ANGLE);
    this.aim.angle = ang;
    this.aim.valid = true;
    if (Math.abs(ang - this.aim.lastAngle) > 0.0004 || !this.aim.trace) {
      this.aim.trace = BC.Collision.traceShot(this.session.board, lp.x, lp.y, ang);
      this.aim.lastAngle = ang;
    }
  };

  /** Klavye / test kancası: verilen açıyla anında nişan al */
  GameView.prototype.setAim = function (ang) {
    var lp = this.launcherPos();
    this.aim.angle = U.clamp(ang, G.MIN_ANGLE, G.MAX_ANGLE);
    this.aim.valid = true;
    this.aim.trace = BC.Collision.traceShot(this.session.board, lp.x, lp.y, this.aim.angle);
    this.aim.lastAngle = this.aim.angle;
  };

  GameView.prototype.canAct = function () {
    return this.phase === 'play' && !this.paused && this.session && this.session.state === 'ready';
  };

  GameView.prototype.swap = function () {
    if (!this.canAct()) return false;
    if (this.session.swap()) {
      this.launcher.swapT = 1;
      BC.Audio.play('swap');
      BC.Haptics.light();
      BC.events.emit('game:swapped');
      return true;
    }
    return false;
  };

  GameView.prototype.fire = function (angle) {
    if (!this.canAct()) return false;
    var pend = this.session.fire(angle);
    if (!pend) return false;
    this.proj = { trace: pend.trace, color: pend.color, dist: 0, seg: 0, trailAcc: 0 };
    this.phase = 'flying';
    this.launcher.loadT = 0;
    this._setMascot('wow', 0.35);
    BC.Audio.play('shoot');
    BC.Haptics.light();
    BC.events.emit('game:fired', { angle: angle, trace: pend.trace });
    return true;
  };

  /* ===================== Güncelleme ===================== */
  GameView.prototype.update = function (rawDt) {
    if (!this.session || !this.L) return;
    if (this.paused) return;
    var dt = rawDt * this.timeScale;
    this.t += dt;
    if (this.quality.ambient) this.ambient.update(dt, this.t);

    if (this.intro) {
      this.intro.t += dt;
      if (this.intro.t >= this.intro.dur) this._endIntro();
    }
    if (this.banner) {
      this.banner.t += dt;
      if (this.banner.t >= this.banner.dur) this.banner = null;
    }
    if (this.proj) this._updateProjectile(dt);
    this._updateWobble(dt);
    this._runTimers(dt);
    this._updatePoppers(dt);
    this._updateFallers(dt);
    this._updateFlyers(dt);
    this._updateBonusShots(dt);
    this.fx.update(dt);
    this.sfx.update(dt);
    this._updateMascot(dt);

    var L = this.launcher;
    if (L.loadT < 1) L.loadT = Math.min(1, L.loadT + dt * 6);
    if (L.swapT > 0) L.swapT = Math.max(0, L.swapT - dt * 6);
    if (L.nextPopT < 1) L.nextPopT = Math.min(1, L.nextPopT + dt * 5);
    if (L.recolorT > 0) L.recolorT = Math.max(0, L.recolorT - dt * 4);
    if (this.scoreBump > 0) this.scoreBump = Math.max(0, this.scoreBump - dt * 5);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 2.8);

    // skor sayacı yumuşak artar
    var target = this.session.score;
    if (this.winSeq && this.winSeq.stage !== 'done') target = this.winSeq.shownScore;
    if (this.displayScore < target) {
      this.displayScore = Math.min(target, this.displayScore + Math.max(4, (target - this.displayScore) * dt * 9));
    }

    var vis = this._visibleObjectives(this._visTmp || (this._visTmp = []));
    for (var oi = 0; oi < vis.length; oi++) {
      if (this.objBump[oi] > 0) this.objBump[oi] = Math.max(0, this.objBump[oi] - dt * 4);
      if (vis[oi] < this.objDisplay[oi]) this.objBump[oi] = 1;
      this.objDisplay[oi] = vis[oi];
    }

    var lr = this.session.board.lowestRow();
    var want = lr >= G.MAX_ROWS - 2 ? 1 : 0;
    this.danger += (want - this.danger) * Math.min(1, dt * 4);

    if (this.lockT > 0) {
      this.lockT -= dt;
      if (this.lockT <= 0 && this.phase === 'resolving' && !this.endState) this.phase = 'play';
    }
    if (this.endState) this._updateEnd(dt);
    if (this.winSeq) this._updateWin(dt);
  };

  GameView.prototype._endIntro = function () {
    if (!this.intro) return;
    this.intro = null;
    if (this.phase === 'intro') {
      this.phase = 'play';
      BC.events.emit('game:introDone', { level: this.levelN });
    }
  };

  GameView.prototype._updateProjectile = function (dt) {
    var p = this.proj, tr = p.trace;
    var step = G.PROJECTILE_SPEED * dt;
    p.dist += step;
    var pos = BC.Collision.pointAt(tr, Math.min(p.dist, tr.length), this._tmpPos || (this._tmpPos = {}));
    if (pos.seg > p.seg) {
      p.seg = pos.seg;
      var bx = tr.points[pos.seg * 2], by = tr.points[pos.seg * 2 + 1];
      this.fx.sparks(bx, by, 4, 50, 8);
      this.fx.ring(bx, by, 4, 18, '#B4FFF7', 0.25, 0.7);
      BC.Audio.play('bounce');
    }
    p.trailAcc += step;
    if (p.trailAcc > 10) {
      p.trailAcc = 0;
      this.fx.trail(pos.x, pos.y, BC.COLOR_BY_KEY[p.color].light, 7);
    }
    p.x = pos.x; p.y = pos.y;
    if (p.dist >= tr.length) this._land();
  };

  GameView.prototype._land = function () {
    var p = this.proj;
    this.proj = null;
    var res = this.session.land();
    if (!res) return;
    var board = this.session.board;
    var cx = board.x(res.r, res.c), cy = board.y(res.r);
    var ex = res.trace.endX, ey = res.trace.endY;

    // yerleşen baloncuk mermi konumundan hücresine yaylanır
    if (!res.popped.length) {
      var wi = board.idx(res.r, res.c) * 4;
      if (wi + 3 < this.wob.length) { this.wob[wi] = ex - cx; this.wob[wi + 1] = ey - cy; this.wob[wi + 2] = 0; this.wob[wi + 3] = 0; }
    }
    this._impulse(ex, ey, res.popped.length ? 120 : 85);
    BC.Audio.play('snap');

    // patlama dalgası
    var maxDelay = 0;
    var sumX = 0, sumY = 0;
    for (var i = 0; i < res.popped.length; i++) {
      var b = res.popped[i];
      var bx = board.x(b.r, b.c), by = board.y(b.r);
      var delay = 0.03 + res.popDepth[i] * 0.05;
      if (delay > maxDelay) maxDelay = delay;
      sumX += bx; sumY += by;
      this.poppers.push({ x: bx, y: by, color: b.color, kind: b.kind, monster: b.monster, delay: delay, i: i });
    }
    // düşenler
    for (var j = 0; j < res.dropped.length; j++) {
      var d = res.dropped[j];
      var dx = board.x(d.r, d.c), dy = board.y(d.r);
      this.fallers.push({
        x: dx, y: dy, vx: (Math.random() - 0.5) * 120 + (dx - ex) * 0.6, vy: -40 - Math.random() * 120,
        rot: 0, vr: (Math.random() - 0.5) * 5, color: d.color, kind: d.kind, monster: d.monster, ice: d.ice || 0,
        delay: maxDelay * 0.6 + 0.04 + Math.random() * 0.12, age: 0, i: j
      });
    }
    // buz: çatlayan ve kırılan buzlar (Aşama 5)
    this._iceFx(res, maxDelay);
    if (this.hasIce && (res.iceBroken.length || res.dropped.length)) this.hasIce = board.countIce() > 0;

    if (res.popped.length) {
      var gx = sumX / res.popped.length, gy = sumY / res.popped.length;
      var txt = '+' + U.fmt(res.points);
      var delayText = Math.min(0.25, maxDelay);
      this._delayed(delayText, function () {
        this.fx.text(gx, gy - 6, txt, res.points >= 300 ? 26 : 20, '#FFFFFF', BC.COLOR_BY_KEY[res.color].deep, 1.0);
        if (res.mult > 1) this.fx.text(gx, gy + 18, 'x' + res.mult.toFixed(2).replace(/\.?0+$/, '').replace('.', ','), 14, '#FFD23C', BC.Gfx.INK, 0.9, -24);
      });
      this.shake = Math.min(1, this.shake + (res.removed >= 10 ? 0.6 : res.removed >= 6 ? 0.3 : 0));
      if (res.praise >= 0) this._praise(res.praise);
      if (res.combo >= 3) {
        var cs = STR.combo(res.combo);
        this._delayed(0.35, function () {
          var L = this.L;
          this.sfx.text(L.w / 2, L.by + 330 * L.k, cs, 22, '#B4FFF7', BC.Gfx.INK, 1.0, -30);
          BC.Audio.play('combo', { level: res.combo - 3 });
        });
      }
      this._setMascot(res.removed >= 6 ? 'happy' : 'happy', res.removed >= 6 ? 1.1 : 0.6);
      if (res.removed >= 6) this.mascot.jump = 1;
      BC.Haptics.medium();
    } else {
      this._setMascot('idle', 0);
    }
    if (res.rescued.length) this._setMascot('happy', 1.4);
    if (res.currentChanged) this.launcher.recolorT = 1;
    this.launcher.nextPopT = 0;

    var cascade = maxDelay + 0.12;
    this.lockT = Math.max(0.08, Math.min(0.42, cascade));
    this.phase = 'resolving';

    if (this.session.state === 'ready' && this.session.shotsLeft <= 3 && !this.lowShotsWarned) {
      this.lowShotsWarned = true;
      var n = this.session.shotsLeft;
      this._delayed(0.4, function () {
        var lp = this.launcherPos();
        this.fx.text(lp.x, lp.y - 58, STR.lastShots(n), 17, '#FFB4A0', BC.Gfx.INK, 1.4, -18);
        BC.Audio.play('warn');
      });
    }

    if (res.outcome) {
      this.endState = { outcome: res.outcome, reason: res.lostReason };
      this.endT = 0;
    }
    BC.events.emit('game:landed', res);
  };

  /** Buz vuruş efektleri: çatlama (kıymık + "çıt") ve kırılma (buz parçaları + "şangır") */
  GameView.prototype._iceFx = function (res, maxDelay) {
    if (!res.iceHit || !res.iceHit.length) return;
    var board = this.session.board, self = this;
    var delay = Math.min(0.2, (maxDelay || 0) * 0.5);
    var cracked = res.iceCracked.slice(), broken = res.iceBroken.slice();
    this._delayed(delay, function () {
      var i, b, x, y;
      for (i = 0; i < cracked.length; i++) {
        b = cracked[i];
        x = board.x(b.r, b.c); y = board.y(b.r);
        self.fx.shards(x, y, 6, 150, false);
        self._wobbleCell(b.r, b.c, 5);
      }
      for (i = 0; i < broken.length; i++) {
        b = broken[i];
        x = board.x(b.r, b.c); y = board.y(b.r);
        self.fx.shards(x, y, 14, 240, true);
        self.fx.ring(x, y, G.R * 0.6, G.R * 1.9, '#DDF6FF', 0.4, 0.85);
        self.fx.sparks(x, y, 3, 60, 10);
        self._wobbleCell(b.r, b.c, 7);
      }
      if (broken.length) { BC.Audio.play('iceBreak', { n: broken.length }); BC.Haptics.light(); }
      else BC.Audio.play('iceCrack', { n: cracked.length });
      var pts = cracked.length * BC.SCORE.ICE_CRACK + broken.length * BC.SCORE.ICE_BREAK;
      if (pts && !res.popped.length) {
        var b0 = (broken[0] || cracked[0]);
        self.fx.text(board.x(b0.r, b0.c), board.y(b0.r) - 10, '+' + pts, 16, '#E4F8FF', '#1C62A8', 0.8);
      }
    });
  };

  /** Bir hücredeki baloncuğu kısaca sarsar (yay sistemi) */
  GameView.prototype._wobbleCell = function (r, c, amp) {
    var board = this.session.board, wi = board.idx(r, c) * 4;
    if (wi + 3 < this.wob.length) { this.wob[wi] += (Math.random() - 0.5) * amp * 2; this.wob[wi + 1] -= amp * 0.6; }
  };

  /** Nişan sırasında bu atışla hasar alacak buzlar (önbellekli; hücre ya da renk değişince yeniden hesaplanır) */
  GameView.prototype._icePreview = function () {
    var tr = this.aim.trace, s = this.session;
    if (!tr || !s || !this.aim.active || !this.aim.valid || !this.hasIce) { this._icePrev = null; return null; }
    var key = tr.r + ',' + tr.c + ',' + s.current + ',' + s.shotsUsed;
    if (this._icePrev && this._icePrev.key === key) return this._icePrev.list;
    var list = BC.Rules.iceHitPreview(s.board, tr.r, tr.c, s.current);
    this._icePrev = { key: key, list: list };
    return list;
  };

  GameView.prototype._praise = function (level) {
    var L = this.L;
    var colors = ['#B4FFF7', '#FFE7A0', '#FFD4E8', '#FFD23C', '#FF9EC8'];
    var text = STR.praise[level];
    this._delayed(0.18, function () {
      this.sfx.text(L.w / 2, L.by + 250 * L.k, text, 30 + level * 4, colors[level], BC.Gfx.INK, 1.1, -26);
      if (level >= 2) this.sfx.confetti(L.w / 2, L.by + 240 * L.k, 14 + level * 6, L.bw * 0.6, ['#1ED6C6', '#FF5AA8', '#FFD23C', '#A262F2', '#3F8CFF', '#FF7E50'], true);
    });
  };

  /* Küçük zamanlayıcı: geciken görsel işler (kare hızından bağımsız) */
  GameView.prototype._delayed = function (sec, fn) {
    this._timers = this._timers || [];
    this._timers.push({ t: sec, fn: fn });
  };

  GameView.prototype._runTimers = function (dt) {
    var list = this._timers;
    if (!list || !list.length) return;
    for (var i = 0; i < list.length;) {
      list[i].t -= dt;
      if (list[i].t <= 0) {
        var fn = list[i].fn;
        list.splice(i, 1);
        try { fn.call(this); } catch (e) { BC.log.error('Zamanlayıcı hatası', e); }
      } else i++;
    }
  };

  GameView.prototype._impulse = function (x, y, power) {
    var board = this.session.board, w = this.wob;
    var R2 = G.D * 2.4;
    board.forEach(function (b, idx) {
      var bx = board.x(b.r, b.c), by = board.y(b.r);
      var d = U.dist(x, y, bx, by);
      if (d < 1 || d > R2) return;
      var f = power * (1 - d / R2);
      var i = idx * 4;
      if (i + 3 >= w.length) return;
      w[i + 2] += (bx - x) / d * f;
      w[i + 3] += (by - y) / d * f;
    });
  };

  GameView.prototype._updateWobble = function (dt) {
    var w = this.wob, k = 330, c = 15;
    var steps = dt > 0.02 ? 2 : 1, h = dt / steps;
    for (var s = 0; s < steps; s++) {
      for (var i = 0; i < w.length; i += 4) {
        if (w[i] === 0 && w[i + 1] === 0 && w[i + 2] === 0 && w[i + 3] === 0) continue;
        w[i + 2] += (-k * w[i] - c * w[i + 2]) * h;
        w[i + 3] += (-k * w[i + 1] - c * w[i + 3]) * h;
        w[i] += w[i + 2] * h;
        w[i + 1] += w[i + 3] * h;
        if (Math.abs(w[i]) < 0.02 && Math.abs(w[i + 1]) < 0.02 && Math.abs(w[i + 2]) < 0.05 && Math.abs(w[i + 3]) < 0.05) {
          w[i] = w[i + 1] = w[i + 2] = w[i + 3] = 0;
        }
      }
    }
  };

  GameView.prototype._updatePoppers = function (dt) {
    for (var i = 0; i < this.poppers.length;) {
      var p = this.poppers[i];
      p.delay -= dt;
      if (p.delay <= 0) {
        this._popFx(p.x, p.y, p.color, p.i);
        this._spawnFlyersFor(p);
        this.poppers.splice(i, 1);
      } else i++;
    }
  };

  GameView.prototype._popFx = function (x, y, color, i) {
    var col = BC.COLOR_BY_KEY[color];
    this.fx.burst(x, y, col.base, 9, 260, { size: 5.5 });
    this.fx.burst(x, y, col.light, 4, 160, { size: 4 });
    this.fx.sparks(x, y, 2, 70, 10);
    this.fx.ring(x, y, G.R * 0.6, G.R * 1.9, col.light, 0.32, 0.8);
    BC.Audio.play('pop', { i: i || 0 });
  };

  GameView.prototype._updateFallers = function (dt) {
    var limitY = this.L.shooterY - 10;
    for (var i = 0; i < this.fallers.length;) {
      var f = this.fallers[i];
      if (f.delay > 0) { f.delay -= dt; i++; continue; }
      f.age += dt;
      f.vy += 2000 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rot += f.vr * dt;
      if (f.x < G.R) { f.x = G.R; f.vx = Math.abs(f.vx) * 0.6; }
      if (f.x > G.WIDTH - G.R) { f.x = G.WIDTH - G.R; f.vx = -Math.abs(f.vx) * 0.6; }
      var burstMonster = f.kind === 'monster' && f.age > 0.28;
      if (f.y > limitY || burstMonster) {
        var col = BC.COLOR_BY_KEY[f.color];
        this.fx.burst(f.x, f.y, col.base, 7, 220, { size: 5 });
        this.fx.sparks(f.x, f.y, 2, 60, 9);
        if (!burstMonster) this.fx.text(f.x, f.y - 14, '+' + BC.SCORE.DROP, 13, '#FFFFFF', col.deep, 0.7, -30);
        BC.Audio.play('plink', { i: f.i });
        this._spawnFlyersFor(f);
        this.fallers.splice(i, 1);
      } else i++;
    }
  };

  /** Bir baloncuğun (tür, renk) katkı verdiği hedeflerin indeksleri */
  GameView.prototype._objsFor = function (kind, color) {
    var objs = this.session.objectives, out = [];
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      if ((o.kind === 'rescue' && kind === 'monster') || (o.kind === 'item' && kind === 'item') ||
          (o.kind === 'color' && o.color === color)) out.push(i);
    }
    return out;
  };

  /**
   * HUD'daki hedef sayıları: oturumun kalan değerine, animasyonu henüz bitmemiş
   * (patlayan, düşen, hedefe uçan) birimler eklenir; sayaç simge vardıkça azalır.
   */
  GameView.prototype._visibleObjectives = function (out) {
    var s = this.session, objs = s.objectives, i;
    out.length = objs.length;
    for (i = 0; i < objs.length; i++) out[i] = 0;
    if (this.winSeq) return out;
    var inflight = this._inflight || (this._inflight = []);
    inflight.length = objs.length;
    for (i = 0; i < objs.length; i++) inflight[i] = 0;
    var lists = [this.poppers, this.fallers];
    for (var li = 0; li < 2; li++) {
      for (i = 0; i < lists[li].length; i++) {
        var u = lists[li][i];
        if (u.kind === 'normal' && !this._hasColorObj) continue;
        var idx = this._objsFor(u.kind, u.color);
        for (var j = 0; j < idx.length; j++) inflight[idx[j]]++;
      }
    }
    for (i = 0; i < this.flyers.length; i++) if (this.flyers[i].obj >= 0) inflight[this.flyers[i].obj]++;
    for (i = 0; i < objs.length; i++) {
      var o = objs[i];
      if (o.kind === 'clear') out[i] = s.board.count() + this.poppers.length + this.fallers.length;
      else if (o.kind === 'rescue') out[i] = s.board.countKind('monster') + inflight[i];
      else out[i] = Math.max(0, o.total - (o.collected - inflight[i]));
    }
    return out;
  };

  /** Patlayan/düşen baloncuk ilgili hedeflere doğru uçan simgeler doğurur */
  GameView.prototype._spawnFlyersFor = function (u) {
    if (this.winSeq) return;
    var idx = this._objsFor(u.kind, u.color);
    if (!idx.length && u.kind === 'monster') { this._spawnFlyer(u.x, u.y, 'monster', u, -1); return; }
    for (var j = 0; j < idx.length; j++) {
      var o = this.session.objectives[idx[j]];
      // hedef tamamlandıysa fazladan uçan simge gösterme (sayaç zaten 0)
      if ((o.kind === 'color' || o.kind === 'item') && this.objDisplay[idx[j]] <= 0) continue;
      this._spawnFlyer(u.x, u.y, o.kind === 'rescue' ? 'monster' : o.kind, u, idx[j]);
    }
  };

  /** type: monster | item | color · obj: hedef indeksi (-1 = ilk çip) */
  GameView.prototype._spawnFlyer = function (x, y, type, u, obj) {
    var s = this.toScreen(x, y);
    this.flyers.push({
      x0: s.x, y0: s.y, x: s.x, y: s.y, t: 0, type: type, obj: obj,
      monster: (u && u.monster) || 'pofi', color: u ? u.color : 'a', scale: 0.6
    });
    if (type === 'monster') {
      this.fx.ring(x, y, 4, G.R * 2.2, '#FFFFFF', 0.4, 0.9);
      this.fx.sparks(x, y, 6, 90, 12);
      BC.Audio.play('rescue');
      BC.Haptics.success();
    } else if (type === 'item') {
      this.fx.ring(x, y, 4, G.R * 2, '#FFE7A0', 0.45, 0.9);
      this.fx.stars(x, y, 3, 120, '#FFD23C');
      BC.Audio.play('rescue');
      BC.Haptics.light();
    }
  };

  GameView.prototype._updateFlyers = function (dt) {
    var chips = this.hud.chips;
    for (var i = 0; i < this.flyers.length;) {
      var f = this.flyers[i];
      f.t += dt;
      var small = f.type === 'color';
      var JUMP = small ? 0.12 : 0.42, FLY = small ? 0.5 : 0.62;
      var chip = chips[f.obj >= 0 ? f.obj : 0] || chips[0] || { x: 40, y: 40 };
      if (f.t < JUMP) {
        var a = f.t / JUMP;
        f.x = f.x0;
        f.y = f.y0 - Math.sin(a * Math.PI) * (small ? 10 : 26);
        f.scale = 0.6 + U.easeOutBack(Math.min(1, a * 1.6)) * 0.6;
      } else {
        var b = U.easeInOutSine(Math.min(1, (f.t - JUMP) / FLY));
        var tx = chip.x, ty = chip.y;
        var mx = f.x0 + (tx - f.x0) * 0.25, my = Math.min(f.y0, ty) - (small ? 50 : 90);
        f.x = (1 - b) * (1 - b) * f.x0 + 2 * (1 - b) * b * mx + b * b * tx;
        f.y = (1 - b) * (1 - b) * f.y0 + 2 * (1 - b) * b * my + b * b * ty;
        f.scale = 1.2 - b * 0.6;
        if (!small && Math.random() < 0.5) this.sfx.sparks(f.x, f.y, 1, 30, 8);
      }
      if (f.t >= JUMP + FLY) {
        this.flyers.splice(i, 1);
        if (f.obj >= 0 && f.obj < this.objBump.length) this.objBump[f.obj] = 1;
        this.sfx.sparks(chip.x, chip.y, small ? 2 : 8, 70, small ? 7 : 11);
        if (!small) BC.Audio.play('coin');
        else if (!this._plinkT || this.t - this._plinkT > 0.06) { this._plinkT = this.t; BC.Audio.play('plink', { i: 3 }); }
      } else i++;
    }
  };

  GameView.prototype._setMascot = function (expr, dur) {
    this.mascot.expr = expr;
    this.mascot.exprT = dur;
  };

  GameView.prototype._updateMascot = function (dt) {
    var m = this.mascot;
    if (m.exprT > 0) {
      m.exprT -= dt;
      if (m.exprT <= 0) m.expr = 'idle';
    }
    m.blinkT -= dt;
    if (m.blinkT < -0.12) m.blinkT = 2 + Math.random() * 3;
    if (m.jump > 0) m.jump = Math.max(0, m.jump - dt * 1.6);
    var tx = 0, ty = 0;
    if (this.aim.active && this.aim.valid) {
      tx = Math.cos(this.aim.angle);
      ty = -Math.sin(this.aim.angle) * 0.8;
    } else if (this.proj) {
      tx = (this.proj.x - (G.WIDTH / 2 - 100)) / 220;
      ty = -0.7;
    } else {
      tx = Math.sin(this.t * 0.6) * 0.5;
      ty = Math.sin(this.t * 0.37) * 0.3;
    }
    m.lookX += (U.clamp(tx, -1, 1) - m.lookX) * Math.min(1, dt * 10);
    m.lookY += (U.clamp(ty, -1, 1) - m.lookY) * Math.min(1, dt * 10);
  };

  /* ===================== Bitiş ===================== */
  GameView.prototype._updateEnd = function (dt) {
    this.endT += dt;
    var busy = this.poppers.length || this.flyers.length || (this.fallers.length && this.endT < 2.2);
    if (busy && this.endT < 3) return;
    var es = this.endState;
    if (!es || this.endT < 0.25) return;
    this.endState = null;
    if (es.outcome === 'won') this._startWin();
    else this._startLose(es.reason);
  };

  GameView.prototype._startWin = function () {
    var s = this.session;
    var fin = s.finalize();
    this.phase = 'winseq';
    this.aim.trace = null;
    this.mascot.dance = true;
    this._setMascot('happy', 99);
    BC.Audio.play('win');
    BC.Haptics.success();
    var remain = [];
    s.board.forEach(function (b) { remain.push(b); });
    this.winSeq = {
      t: 0, stage: remain.length ? 'clear' : 'bonus', remain: remain,
      shotsTotal: fin.shotsLeft, fired: 0, nextShotT: 0.5,
      baseScore: fin.score - fin.bonus, shownScore: fin.score - fin.bonus, fin: fin
    };
    var kinds = s.objectives.map(function (o) { return o.kind; });
    var title = kinds.length > 1 ? STR.allGoals : kinds[0] === 'rescue' ? STR.rescued :
      (kinds[0] === 'item' || kinds[0] === 'color') ? STR.collected : 'Tertemiz!';
    this.banner = { title: title, sub: '', t: 0, dur: 1.5, kind: 'win' };
    var L = this.L;
    this.sfx.confetti(L.w / 2, L.by + 120 * L.k, 50, L.bw, ['#1ED6C6', '#FF5AA8', '#FFD23C', '#A262F2', '#3F8CFF', '#FF7E50'], true);
    BC.events.emit('game:won', this.result());
  };

  GameView.prototype._updateWin = function (dt) {
    var w = this.winSeq;
    w.t += dt;
    var board = this.session.board;
    if (w.stage === 'clear') {
      // kalan baloncuklar sevinçle düşer (puan yok, yalnızca görsel)
      var self = this;
      w.remain.forEach(function (b, i) {
        self.fallers.push({
          x: board.x(b.r, b.c), y: board.y(b.r), vx: (Math.random() - 0.5) * 160, vy: -80 - Math.random() * 160,
          rot: 0, vr: (Math.random() - 0.5) * 6, color: b.color, kind: b.kind === 'item' ? 'item' : 'normal', monster: null,
          delay: 0.25 + i * 0.012, age: 0, i: i
        });
        board.remove(b.r, b.c);
      });
      w.remain = [];
      w.stage = 'bonus';
      w.nextShotT = w.t + 0.9;
    } else if (w.stage === 'bonus') {
      if (w.fired < w.shotsTotal && w.t >= w.nextShotT) {
        w.fired++;
        w.nextShotT = w.t + Math.max(0.07, 0.16 - w.fired * 0.006);
        this._fireBonus(w.fired);
        if (w.fired === 1) {
          var L = this.L;
          this.sfx.text(L.w / 2, L.by + 360 * L.k, STR.bonus, 30, '#FFD23C', BC.Gfx.INK, 1.2, -20);
        }
      }
      if (w.fired >= w.shotsTotal && !this.bonusShots.length && w.t > w.nextShotT + 0.3) {
        w.stage = 'done';
        w.doneT = w.t;
        w.shownScore = w.fin.score;
      }
    } else if (w.stage === 'done') {
      if (!w.emitted && w.t > w.doneT + 0.7 && !this.fallers.length) {
        w.emitted = true;
        this.phase = 'done';
        BC.events.emit('game:winDone', this.result());
      }
    }
  };

  GameView.prototype._fireBonus = function (i) {
    var lp = this.launcherPos();
    var keys = this.level.colors;
    var tx = 40 + Math.random() * (G.WIDTH - 80), ty = 60 + Math.random() * 260;
    this.bonusShots.push({ x: lp.x, y: lp.y, x0: lp.x, y0: lp.y, tx: tx, ty: ty, t: 0, dur: 0.32, color: keys[i % keys.length], i: i });
    BC.Audio.play('shoot');
  };

  GameView.prototype._updateBonusShots = function (dt) {
    for (var i = 0; i < this.bonusShots.length;) {
      var b = this.bonusShots[i];
      b.t += dt;
      var a = Math.min(1, b.t / b.dur);
      var e = U.easeOutCubic(a);
      b.x = b.x0 + (b.tx - b.x0) * e;
      b.y = b.y0 + (b.ty - b.y0) * e;
      if (Math.random() < 0.7) this.fx.trail(b.x, b.y, BC.COLOR_BY_KEY[b.color].light, 6);
      if (a >= 1) {
        var col = BC.COLOR_BY_KEY[b.color];
        this.fx.burst(b.x, b.y, col.base, 12, 320, { size: 6 });
        this.fx.stars(b.x, b.y, 4, 160, '#FFD23C');
        this.fx.ring(b.x, b.y, 6, 46, col.light, 0.45, 0.9);
        this.fx.text(b.x, b.y, '+' + BC.SCORE.SHOT_BONUS, 18, '#FFD23C', BC.Gfx.INK, 0.8, -40);
        BC.Audio.play('bonus', { i: b.i });
        if (this.winSeq) this.winSeq.shownScore = Math.min(this.winSeq.fin.score, this.winSeq.shownScore + BC.SCORE.SHOT_BONUS);
        this.bonusShots.splice(i, 1);
      } else i++;
    }
  };

  GameView.prototype._skipWin = function () {
    var w = this.winSeq;
    if (!w || w.emitted) return;
    if (w.stage !== 'done') {
      this.bonusShots.length = 0;
      w.fired = w.shotsTotal;
      w.stage = 'done';
      w.doneT = w.t - 0.4;
      w.shownScore = w.fin.score;
      this.displayScore = w.fin.score;
    }
    this.fallers.length = 0;
  };

  GameView.prototype._startLose = function (reason) {
    this.phase = 'loseseq';
    this.aim.trace = null;
    this._setMascot('sad', 99);
    BC.Audio.play('lose');
    BC.Haptics.soft();
    this.banner = { title: reason === 'overflow' ? STR.overflow : STR.outOfShots, sub: '', t: 0, dur: 1.6, kind: 'lose' };
    BC.events.emit('game:lost', this.result());
    this._delayed(1.35, function () {
      this.phase = 'done';
      BC.events.emit('game:loseDone', this.result());
    });
  };

  /** Seviye sonucu (UI ve kayıt için) */
  GameView.prototype.result = function () {
    var s = this.session;
    return {
      level: this.levelN,
      won: s.state === 'won',
      reason: s.lostReason,
      score: s.score,
      stars: s.finalized ? s.finalized.stars : 0,
      bonus: s.finalized ? s.finalized.bonus : 0,
      shotsLeft: s.shotsLeft,
      shots: s.shotsUsed,
      stats: s.stats,
      bestCombo: s.bestCombo,
      rescued: s.rescuedIds,
      objectives: s.objectiveStatus(),
      goal: this.level.goal.type,
      ms: Date.now() - (this.startedAt || Date.now())
    };
  };

  /** Aşama 8 için hazır: ek atışla devam */
  GameView.prototype.continueWithShots = function (n) {
    if (!this.session.continueWithShots(n)) return false;
    this.phase = 'play';
    this.mascot.expr = 'idle';
    this.lowShotsWarned = false;
    return true;
  };

  /* ===================== Çizim ===================== */
  GameView.prototype.render = function (ctx) {
    var L = this.L;
    if (!L || !this.session) return;
    var dpr = L.dpr, k = L.k;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (this.bg) ctx.drawImage(this.bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (this.quality.ambient) this.ambient.draw(ctx, 0.35);

    var sx = 0, sy = 0;
    if (this.shake > 0 && this.quality.shake) {
      var a = this.shake * this.shake * 5;
      sx = (Math.random() - 0.5) * a;
      sy = (Math.random() - 0.5) * a;
    }
    ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * (L.bx + sx), dpr * (L.by + sy));
    this._drawDanger(ctx);
    this._drawGuide(ctx);
    this._drawBubbles(ctx);
    this._drawIcePreview(ctx);
    this._drawPoppers(ctx);
    this._drawFallers(ctx);
    this._drawBonusShots(ctx);
    this._drawProjectile(ctx);
    this._drawLauncher(ctx);
    this._drawMascot(ctx);
    this.fx.draw(ctx);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this._drawHUD(ctx);
    this._drawFlyers(ctx);
    this.sfx.draw(ctx);
    this._drawBanner(ctx);
  };

  GameView.prototype._drawDanger = function (ctx) {
    var d = this.danger;
    var pulse = d > 0.05 ? (0.5 + 0.5 * Math.sin(this.t * 7)) * d : 0;
    ctx.save();
    ctx.strokeStyle = d > 0.05 ? 'rgba(255,110,90,' + (0.35 + pulse * 0.55).toFixed(3) + ')' : 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 2 + pulse * 2;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -this.t * 12;
    ctx.beginPath();
    ctx.moveTo(4, DANGER_Y);
    ctx.lineTo(G.WIDTH - 4, DANGER_Y);
    ctx.stroke();
    ctx.restore();
  };

  GameView.prototype._drawGuide = function (ctx) {
    var tr = this.aim.trace;
    if (!tr || !this.aim.active || this.phase !== 'play') return;
    var col = BC.COLOR_BY_KEY[this.session.current] || BC.COLORS[0];
    var pts = tr.points;
    var spacing = 15, offset = (this.t * 46) % spacing;
    var total = tr.length, acc = 0, drawn = 0;
    ctx.save();
    for (var i = 0; i + 3 < pts.length; i += 2) {
      var x0 = pts[i], y0 = pts[i + 1], x1 = pts[i + 2], y1 = pts[i + 3];
      var seg = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      var start = (spacing - ((acc - offset) % spacing + spacing) % spacing) % spacing;
      for (var s = start; s < seg; s += spacing) {
        var d = acc + s;
        if (d < 34) continue;                                    // fırlatıcının üstünde başlasın
        var f = d / total;
        var x = x0 + (x1 - x0) * (s / seg), y = y0 + (y1 - y0) * (s / seg);
        var r = 3.6 - f * 1.2;
        ctx.globalAlpha = 0.9 - f * 0.35;
        ctx.fillStyle = f > 0.75 ? col.light : '#FFFFFF';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fill();
        drawn++;
      }
      acc += seg;
    }
    ctx.globalAlpha = 1;
    var board = this.session.board;
    var gx = board.x(tr.r, tr.c), gy = board.y(tr.r);
    var ghost = BC.Sprites.bubble(this.session.current, 'ghost');
    var hs = G.R + BC.Sprites.PAD;
    ctx.drawImage(ghost, gx - hs, gy - hs, hs * 2, hs * 2);
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.25 * Math.sin(this.t * 8)).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(gx, gy, G.R + 3 + Math.sin(this.t * 8) * 1.5, 0, TAU);
    ctx.stroke();
    ctx.restore();
  };

  GameView.prototype._bubbleSprite = function (b, idx) {
    if (b.kind === 'monster') {
      var blink = ((this.t * 0.55 + idx * 0.37) % 4) < 0.13 ? 1 : 0;
      return BC.Sprites.bubble(b.color, 'monster', b.monster, blink);
    }
    if (b.kind === 'item') {
      var tw = ((this.t * 0.7 + idx * 0.53) % 2.4) < 0.3 ? 1 : 0;
      return BC.Sprites.bubble(b.color, 'item', this.worldItem ? this.worldItem.id : 'inci', tw);
    }
    return BC.Sprites.bubble(b.color, b.kind);
  };

  /** Patlayan/düşen baloncuk sprite'ı (türünü korur) */
  GameView.prototype._spriteOf = function (kind, color, monster) {
    if (kind === 'monster') return BC.Sprites.bubble(color, 'monster', monster, 0);
    if (kind === 'item') return BC.Sprites.bubble(color, 'item', this.worldItem ? this.worldItem.id : 'inci', 0);
    return BC.Sprites.bubble(color, 'normal');
  };

  GameView.prototype._drawBubbles = function (ctx) {
    var board = this.session.board, w = this.wob, cells = board.cells;
    var hs = G.R + BC.Sprites.PAD, size = hs * 2;
    var intro = this.intro;
    for (var idx = 0; idx < cells.length; idx++) {
      var b = cells[idx];
      if (!b) continue;
      var x = board.x(b.r, b.c), y = board.y(b.r);
      var wi = idx * 4;
      if (wi + 1 < w.length) { x += w[wi]; y += w[wi + 1]; }
      if (intro) {
        var delay = b.r * 0.045 + Math.abs(b.c - 5) * 0.012;
        var a = U.clamp((intro.t - delay) / 0.5, 0, 1);
        if (a <= 0) continue;
        y -= (1 - U.easeOutBack(a, 1.3)) * (90 + b.r * 12);
      }
      if (b.kind === 'monster') {
        // canavarlı baloncuğu aynı renkteki komşularından ayıran nabız gibi atan hale
        var pulse = 0.5 + 0.5 * Math.sin(this.t * 3.2 + idx);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.45 + pulse * 0.45).toFixed(3) + ')';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(x, y, G.R + 1.5 + pulse * 1.5, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,231,96,' + (0.35 + pulse * 0.4).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, G.R + 4.5 + pulse * 2, 0, TAU);
        ctx.stroke();
      }
      ctx.drawImage(this._bubbleSprite(b, idx), x - hs, y - hs, size, size);
      if (b.ice > 0) {
        ctx.drawImage(BC.Sprites.ice(b.ice), x - hs, y - hs, size, size);
        // ara sıra köşede parlayan buz ışıltısı
        var iph = (this.t * 0.6 + idx * 0.43) % 3.1;
        if (iph < 0.45) {
          var ia = Math.sin(iph / 0.45 * Math.PI), isp = BC.Sprites.sparkle(), iss = 13 * ia + 3;
          ctx.globalAlpha = ia * 0.9;
          ctx.drawImage(isp, x - G.R * 0.55 - iss / 2, y - G.R * 0.5 - iss / 2, iss, iss);
          ctx.globalAlpha = 1;
        }
      }
      if (b.kind === 'item') {
        // ara sıra parlayan yıldızcık: nesnenin toplanabilir olduğunu hatırlatır
        var ph = (this.t * 0.9 + idx * 0.61) % 2.2;
        if (ph < 0.5) {
          var sa = Math.sin(ph / 0.5 * Math.PI);
          var sp = BC.Sprites.sparkle(), ss = 15 * sa + 4;
          ctx.globalAlpha = sa;
          ctx.drawImage(sp, x + G.R * 0.45 - ss / 2, y - G.R * 0.55 - ss / 2, ss, ss);
          ctx.globalAlpha = 1;
        }
      }
    }
  };

  /** Nişan önizlemesi: vurulacak buzlar parlar, kırılacak olanlar daha güçlü (sarı) parlar */
  GameView.prototype._drawIcePreview = function (ctx) {
    var list = this._icePreview();
    if (!list || !list.length) return;
    var board = this.session.board, pulse = 0.5 + 0.5 * Math.sin(this.t * 9);
    ctx.save();
    ctx.lineJoin = 'round';
    for (var i = 0; i < list.length; i++) {
      var b = list[i].b, brk = list[i].breaks;
      var x = board.x(b.r, b.c), y = board.y(b.r);
      ctx.translate(x, y);
      BC.Gfx.hexPath(ctx, G.R * (1.2 + pulse * 0.08), G.R * 0.32);
      // koyu alt çizgi + açık üst çizgi: hem açık hem koyu baloncukların yanında okunur
      ctx.lineWidth = brk ? 7.5 : 6.5;
      ctx.strokeStyle = 'rgba(20, 40, 110, ' + (0.45 + pulse * 0.3).toFixed(3) + ')';
      ctx.stroke();
      ctx.lineWidth = brk ? 4 : 3.2;
      ctx.strokeStyle = brk ? 'rgba(255, 226, 92, ' + (0.7 + pulse * 0.3).toFixed(3) + ')' : 'rgba(225, 248, 255, ' + (0.65 + pulse * 0.35).toFixed(3) + ')';
      ctx.stroke();
      ctx.translate(-x, -y);
    }
    ctx.restore();
  };

  GameView.prototype._drawPoppers = function (ctx) {
    var hs = G.R + BC.Sprites.PAD;

    _onKey: function (e) {
      if (e.key !== 'Escape') return;
      if (this.modalOpen) { if (this.modalDismissible) this.closeModal(); return; }
      if (this.current === 'game') BC.Engine.pause();
      else if (this.current !== 'menu') this.show('menu');
    },

    /**
     * OYNA: çift dokunuşa karşı kilitli. Onay sesi + basılma/yaylanma + Pofi'nin heyecanı
     * hemen başlar; seviye PLAY_DELAY ms sonra açılır (animasyon girişi geciktirmez).
     * Her zaman sıradaki açılmış seviyeyi başlatır (RewardManager.currentLevel).
     */
    PLAY_DELAY: 160,
    onPlay: function () {
      if (this._playBusy) return;
      var d = BC.SaveManager.data;
      if (d.progress.unlocked > BC.LevelManager.count()) {
        this.show('levels');
        this.toast('Tüm seviyeleri bitirdin! Yenileri yolda.');
        return;
      }
      this._playBusy = true;
      var btn = $('btn-play');
      btn.setAttribute('aria-busy', 'true');
      btn.classList.remove('is-launch');
      void btn.offsetWidth;
      btn.classList.add('is-launch');
      BC.Audio.play('confirm');
      BC.Haptics.light();
      if (BC.Engine.menu) BC.Engine.menu.react('excited');
      var n = BC.RewardManager.currentLevel();
      setTimeout(function () {
        // bu arada başka bir ekrana geçildiyse (ör. ayarlar) yine de tek seviye açılır
        if (BC.Engine.scene !== 'game') BC.Engine.startLevel(n);
        UI._playBusy = false;
        btn.removeAttribute('aria-busy');
      }, this.PLAY_DELAY);
    },

    /* ---------- Modal altyapısı ---------- */
    /**
     * @param {{title:string, tone?:string, body:(Node|string), actions?:Array, dismissible?:boolean,
     *          onClose?:function, className?:string, closeButton?:boolean}} o
     */
    openModal: function (o) {
      var layer = $('modal-layer'), modal = $('modal');
      modal.className = 'modal tone-' + (o.tone || 'purple') + (o.className ? ' ' + o.className : '');
      $('modal-title').textContent = o.title || '';
      var body = $('modal-body');
      body.innerHTML = '';
      if (typeof o.body === 'string') body.innerHTML = o.body; else if (o.body) body.appendChild(o.body);
      var acts = $('modal-actions');
      acts.innerHTML = '';
      var self = this, first = null;
      (o.actions || []).forEach(function (a) {
        var b = h('button', 'btn btn-' + (a.kind || 'secondary') + (a.icon && !a.label ? ' btn-icon' : ''));
        if (a.id) b.id = a.id;
        b.innerHTML = (a.icon ? icon(a.icon) : '') + (a.label ? '<span>' + esc(a.label) + '</span>' : '');
        if (a.aria || !a.label) b.setAttribute('aria-label', a.aria || a.label || '');
        b.addEventListener('click', function () { a.onClick && a.onClick(b); });
        acts.appendChild(b);
        if (a.kind === 'primary' && !first) first = b;
      });
      this.modalDismissible = o.dismissible !== false;
      modal.querySelector('.modal-close').hidden = !(o.closeButton && this.modalDismissible);
      this._onClose = o.onClose || null;
      layer.hidden = false;
      // bir sonraki karede açılış animasyonu
      requestAnimationFrame(function () { layer.classList.add('is-open'); });
      this.modalOpen = true;
      document.documentElement.classList.add('modal-open');
      if (first) setTimeout(function () { try { first.focus({ preventScroll: true }); } catch (e) { /* yoksay */ } }, 60);
    },

    closeModal: function (silent) {
      if (!this.modalOpen) return;
      var layer = $('modal-layer');
      layer.classList.remove('is-open');
      this.modalOpen = false;
      document.documentElement.classList.remove('modal-open');
      var cb = this._onClose;
      this._onClose = null;
      setTimeout(function () { if (!UI.modalOpen) layer.hidden = true; }, 200);
      if (cb && !silent) cb();
    },

    toast: function (msg, ms) {
      var box = $('toasts');
      var t = h('div', 'toast', esc(msg));
      box.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('in'); });
      setTimeout(function () {
        t.classList.remove('in');
        setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
      }, ms || 2600);
    },

    toastOnce: function (key, msg, ms) {
      if (this._toastSeen[key]) return;
      this._toastSeen[key] = true;
      this.toast(msg, ms);
    },

        '<p class="muted">Yanlışlıkla silinmesin diye kırmızı düğmeyi <b>basılı tut</b>.</p>';
      var holdBtn;
      this.openModal({
        title: 'İlerleme silinsin mi?', tone: 'coral', body: body,
        actions: [
          { label: 'Vazgeç', kind: 'primary', onClick: function () { UI.closeModal(); } },
          { label: 'Basılı tut ve sil', kind: 'danger', id: 'btn-reset-hold', onClick: function () { } }
        ],
        onClose: function () { UI.openSettings(fromPause); }
      });
      holdBtn = $('btn-reset-hold');
      holdBtn.classList.add('hold-btn', 'no-tap-sound');
      var timer = null, start = 0, raf = 0;
      var fill = h('i', 'hold-fill');
      holdBtn.appendChild(fill);
      var cancel = function () {
        if (timer) { clearTimeout(timer); timer = null; }
        cancelAnimationFrame(raf);
        fill.style.transform = 'scaleX(0)';
      };
      var tick = function () {
        var p = Math.min(1, (performance.now() - start) / 1300);
        fill.style.transform = 'scaleX(' + p.toFixed(3) + ')';
        if (p < 1) raf = requestAnimationFrame(tick);
      };
      holdBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        start = performance.now();
        tick();
        timer = setTimeout(function () {
          timer = null;
          BC.SaveManager.resetProgress();
          BC.Engine.applySettings();
          UI._onClose = null;
          UI.closeModal(true);
          UI.refreshMenu();
          UI.toast('İlerleme sıfırlandı.');
        }, 1300);

      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { holdBtn.addEventListener(ev, cancel); });

    /* ---------- Ebeveyn kapısı ve ebeveyn alanı ---------- */
    /**
     * Ebeveyn kapısı: sayılar yazıyla sorulur, rakam tuş takımıyla cevaplanır.
     * 3 yanlış cevapta 1 dakika kilit (kayıtta tutulur).
     */
    openParentalGate: function (onPass, onCancel) {
      var PG = BC.ParentalGate;
      var ch = PG.create();
      this._gate = ch;
      var input = '';
      var body = h('div', 'pgate');
      body.innerHTML = '<p class="pg-lead">Bu bölüm ebeveynler içindir.</p>' +
        '<p class="pg-q">Devam etmek için sonucu yazın:<b id="pg-question"></b></p>' +
        '<div class="pg-display" id="pg-display" aria-live="polite"></div>' +
        '<div class="pg-keys" id="pg-keys"></div><p class="pg-msg" id="pg-msg" aria-live="assertive"></p>';
      var keys = body.querySelector('#pg-keys');
      var draw = function () {
        body.querySelector('#pg-question').textContent = ch.text + ' = ?';
        body.querySelector('#pg-display').textContent = input || '…';
      };
      var setLocked = function (ms) {
        var secs = Math.ceil(ms / 1000);
        body.querySelector('#pg-msg').textContent = 'Çok fazla yanlış deneme. ' + secs + ' saniye sonra tekrar deneyin.';
        Array.prototype.forEach.call(keys.querySelectorAll('button'), function (b) { b.disabled = true; });
      };
      var submit = function () {
        var r = PG.verify(ch, input);
        if (r.ok) {
          UI._onClose = null;
          UI.closeModal(true);
          document.removeEventListener('keydown', onKey, true);
          onPass();
          return;
        }
        input = '';
        if (r.locked) { setLocked(r.waitMs); draw(); return; }
        ch = PG.create();
        UI._gate = ch;
        body.querySelector('#pg-msg').textContent = 'Yanlış cevap. Kalan deneme: ' + r.triesLeft;
        draw();
      };
      var press = function (k) {
        if (k === 'sil') input = input.slice(0, -1);
        else if (k === 'tamam') { submit(); return; }
        else if (input.length < 3) input += k;
        draw();
      };
      ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'sil', '0', 'tamam'].forEach(function (k) {
        var b = h('button', 'pg-key' + (k === 'tamam' ? ' is-ok' : k === 'sil' ? ' is-del' : ''), k === 'sil' ? '⌫' : k === 'tamam' ? 'Tamam' : k);
        b.type = 'button';
        b.id = 'pg-key-' + k;
        b.setAttribute('aria-label', k === 'sil' ? 'Sil' : k === 'tamam' ? 'Tamam' : k);
        b.addEventListener('click', function () { press(k); });
        keys.appendChild(b);
      });
      var onKey = function (e) {
        if (!UI.modalOpen) { document.removeEventListener('keydown', onKey, true); return; }
        if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
        else if (e.key === 'Backspace') { press('sil'); e.preventDefault(); }
        else if (e.key === 'Enter') { press('tamam'); e.preventDefault(); }
      };
      document.addEventListener('keydown', onKey, true);
      this.openModal({
        title: 'Ebeveyn kapısı', tone: 'purple', body: body, closeButton: true, className: 'modal-pgate',
        actions: [{ label: 'Vazgeç', kind: 'light', id: 'btn-pg-cancel', onClick: function () { UI.closeModal(); } }],
        onClose: function () { document.removeEventListener('keydown', onKey, true); if (onCancel) onCancel(); }
      });
      draw();
      var wait = PG.lockedFor();
      if (wait > 0) setLocked(wait);
    },

/* ===== 51-level-map.js ===== */
/* =====================================================================
 * 51 LevelMap — 1.000 seviyelik sanallaştırılmış harita
 *
 * Harita tek bir kaydırma kabıdır (yerel, ivmeli iOS kaydırması). İçindeki
 * katman haritanın tam yüksekliğindedir ama DOM'da yalnızca görünen alan ve
 * çevresi (her yönde ~1,2 ekran) bulunur:
 *   • seviye düğümleri: ~40 düğümlük havuz, yeniden kullanılır
 *   • yol: 25 seviyelik SVG parçaları (havuzdan)
 *   • dünya afişleri: tuvale çizilen manzara + ilerleme + yıldız sandıkları
 *     + dünyanın yenilikleri/engelleri (havuzdan, en çok 3 tuval)
 *   • dünya zeminleri: 10 hafif CSS degrade katmanı
 * Kaydırma olayı pasif dinlenir ve en çok bir kez/kare (rAF) işlenir; düğüm
 * konumları sabittir (transform), kaydırırken yeniden konumlandırma yapılmaz.
 * ===================================================================== */
(function (root) {
  'use strict';
  var BC = root.BC;
  var U = BC.U;

  var ROW = 86;            // seviye başına dikey aralık (px)
  var BANNER_H = 336;      // dünya afişi yüksekliği (manzara şeridi + bilgi kartı)
  var ART_H = 132;         // afişin üstündeki manzara şeridi
  var WORLD_GAP = 26;
  var PAD_TOP = 6, PAD_BOTTOM = 140;
  var CHUNK = 25;          // yol parçası başına seviye
  var BUFFER = 1.2;        // görünen alanın üstünde/altında hazırlanan ekran sayısı
  var NODE = 64;
  var COLORS = ['c-a', 'c-b', 'c-c', 'c-d', 'c-e', 'c-f'];

  function $(id) { return document.getElementById(id); }
  function icon(name, cls) { return '<svg class="ico ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  var M = {
    built: false,
    scroller: null, inner: null, layer: null, fab: null,
    W: 360, H: 0, total: 1000, vh: 600,
    worldTop: [],
    nodes: {}, nodePool: [], nodeCount: 0,
    chunks: {}, chunkPool: [],
    banners: {}, bannerPool: [],
    worldBgs: [],
    marker: null,
    cur: 1, unlocked: 1,
    _raf: 0,
    stats: { renders: 0, lastMs: 0, maxMs: 0, samples: [] },   // samples: son 600 güncelleme süresi (performans testi)

    /* ---------- kurulum ---------- */
    init: function () {
      if (this.built) return;
      this.scroller = $('levels-scroll');
      this.inner = $('map-inner');
      this.layer = $('levels-list');
      this.fab = $('map-fab');
      // katmanlar (alttan üste): dünya zeminleri, yol, afişler, düğümler + işaret
      var mk = function (cls) { var d = document.createElement('div'); d.className = 'ml ' + cls; M.layer.appendChild(d); return d; };
      this.lBg = mk('ml-bg');
      this.lPath = mk('ml-path');
      this.lBan = mk('ml-ban');
      this.lNode = mk('ml-node');
      var self = this;
      this.scroller.addEventListener('scroll', function () { self.schedule(); }, { passive: true });
      root.addEventListener('resize', function () { if (BC.UI.current === 'levels') self.relayout(true); });
      this.built = true;
    },

    /** Harita ekranı açılırken: durumu oku, yerleşimi kur, mevcut seviyeye kaydır */
    show: function () {
      this.init();
      this.total = BC.LevelManager.count();
      this.cur = BC.RewardManager.currentLevel();
      this.unlocked = Math.min(this.total, BC.SaveManager.data.progress.unlocked);
      this.relayout(false);
      this.scrollToLevel(this.cur, false);
      this.render(true);
      var stars = $('levels-stars');
      if (stars) stars.textContent = U.fmt(BC.RewardManager.totalStars());
    },

    relayout: function (keepCenter) {
      var keep = keepCenter ? this.levelAtY(this.scroller.scrollTop + this.vh / 2) : null;
      this.vh = this.scroller.clientHeight || 600;
      this.W = Math.max(300, Math.min(this.scroller.clientWidth || 360, 640));
      var y = PAD_TOP;
      this.worldTop = [];
      var total = this.total;
      for (var i = 0; i < BC.WORLDS.length; i++) {
        var w = BC.WORLDS[i];
        if (w.from > total) break;
        this.worldTop[i] = y;
        y += BANNER_H + (Math.min(w.to, total) - w.from + 1) * ROW + WORLD_GAP;
      }
      this.H = y + PAD_BOTTOM;
      this.inner.style.height = this.H + 'px';
      this.inner.style.width = this.W + 'px';
      this._buildWorldBgs();
      // tüm atanmış öğeler yeni genişliğe göre yeniden kurulur
      var self = this;
      Object.keys(this.nodes).forEach(function (n) { self._releaseNode(Number(n)); });
      Object.keys(this.chunks).forEach(function (k) { self._releaseChunk(Number(k)); });
      Object.keys(this.banners).forEach(function (wi) { self._releaseBanner(Number(wi)); });
      if (keep) this.scrollToLevel(keep, false);
      this.render(true);
    },

    _buildWorldBgs: function () {
      var self = this;
      this.worldBgs.forEach(function (el) { el.remove(); });
      this.worldBgs = [];
      this.worldTop.forEach(function (top, i) {
        var w = BC.WORLDS[i], th = BC.THEMES[w.theme];
        var el = document.createElement('div');
        el.className = 'mworld theme-' + w.theme;
        var h = BANNER_H + (Math.min(w.to, self.total) - w.from + 1) * ROW + WORLD_GAP;
        el.style.top = top + 'px';
        el.style.height = h + 'px';
        el.style.setProperty('--wt', th.map.top);
        el.style.setProperty('--wb', th.map.bottom);
        el.style.setProperty('--wa', th.map.accent);
        self.lBg.appendChild(el);
        self.worldBgs.push(el);
      });
    },

    /* ---------- geometri ---------- */
    worldIndexOf: function (n) { return BC.worldOf(n).id - 1; },
    nodeY: function (n) {
      var wi = this.worldIndexOf(n), w = BC.WORLDS[wi];
      return this.worldTop[wi] + BANNER_H + (n - w.from) * ROW + ROW / 2;
    },
    nodeX: function (n) {
      var amp = Math.min(this.W * 0.3, this.W / 2 - NODE * 0.8);
      return this.W / 2 + amp * Math.sin((n - 1) * 0.78);
    },
    /** y konumundaki (ya da en yakın) seviye */
    levelAtY: function (y) {
      var wi = 0;
      for (var i = 0; i < this.worldTop.length; i++) if (this.worldTop[i] <= y) wi = i;
      var w = BC.WORLDS[wi];
      var k = Math.floor((y - this.worldTop[wi] - BANNER_H) / ROW);
      return U.clamp(w.from + k, w.from, Math.min(w.to, this.total));
    },

    /* ---------- kaydırma ---------- */
    schedule: function () {
      if (this._raf) return;
      var self = this;
      this._raf = requestAnimationFrame(function () { self._raf = 0; self.render(false); });
    },

    scrollToLevel: function (n, smooth) {
      var target = U.clamp(this.nodeY(n) - this.vh * 0.55, 0, Math.max(0, this.H - this.vh));
      if (smooth && this.scroller.scrollTo) {
        try { this.scroller.scrollTo({ top: target, behavior: 'smooth' }); return; } catch (e) { /* eski tarayıcı */ }
      }
      this.scroller.scrollTop = target;
    },

    /* ---------- çizim (yalnızca görünen aralık) ---------- */
    render: function (force) {
      if (!this.built || !this.worldTop.length) return;
      var t0 = (root.performance && performance.now) ? performance.now() : 0;
      var top = this.scroller.scrollTop;
      var y0 = top - this.vh * BUFFER, y1 = top + this.vh * (1 + BUFFER);
      var first = this.levelAtY(Math.max(0, y0)), last = this.levelAtY(y1);
      var self = this, n;

      // düğümler
      Object.keys(this.nodes).forEach(function (k) {
        var nn = Number(k);
        if (nn < first || nn > last) self._releaseNode(nn);
      });
      for (n = first; n <= last; n++) {
        if (!this.nodes[n]) this._assignNode(n);
        else if (force) this._paintNode(this.nodes[n], n);
      }
      // yol parçaları
      var k0 = Math.floor((first - 1) / CHUNK), k1 = Math.floor((last - 1) / CHUNK);
      Object.keys(this.chunks).forEach(function (k) {
        var kk = Number(k);
        if (kk < k0 || kk > k1) self._releaseChunk(kk);
      });
      for (var k = k0; k <= k1; k++) if (!this.chunks[k] || force) this._assignChunk(k);
      // afişler
      for (var wi = 0; wi < this.worldTop.length; wi++) {
        var bt = this.worldTop[wi], visible = bt + BANNER_H > y0 && bt < y1;
        if (visible && !this.banners[wi]) this._assignBanner(wi);
        else if (visible && force) this._paintBanner(this.banners[wi], wi);
        else if (!visible && this.banners[wi]) this._releaseBanner(wi);
      }
      this._placeMarker();
      this._updateFab(top);
      this.stats.renders++;
      if (t0) {
        var ms = performance.now() - t0;
        this.stats.lastMs = ms;
        if (ms > this.stats.maxMs) this.stats.maxMs = ms;
        var smp = this.stats.samples;
        smp.push(ms);
        if (smp.length > 600) smp.shift();
      }
    },

    /* ---------- düğüm havuzu ---------- */
    _assignNode: function (n) {
      var el = this.nodePool.pop();
      if (!el) {
        el = document.createElement('button');
        el.type = 'button';
        el.innerHTML = '<span class="mn-bubble"><b></b>' + icon('lock', 'mn-lock') + '</span><span class="mn-stars"><i>' + icon('star') +
          '</i><i>' + icon('star') + '</i><i>' + icon('star') + '</i></span><span class="mn-badge"></span>';
        this.lNode.appendChild(el);
        this.nodeCount++;
      }
      el.hidden = false;
      el.style.transform = 'translate3d(' + Math.round(this.nodeX(n) - NODE / 2) + 'px,' + Math.round(this.nodeY(n) - NODE / 2) + 'px,0)';
      this.nodes[n] = el;
      this._paintNode(el, n);
    },

    _paintNode: function (el, n) {
      var R = BC.RewardManager;
      var rec = R.record(n);
      var unlocked = n <= this.unlocked;
      var stars = rec ? rec.s : 0;
      var done = !!(rec && rec.c > 0);
