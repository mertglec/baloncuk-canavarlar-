    _blobSprite: function (k) {
      var cols = [['rgba(30,214,198,0.30)', 'rgba(30,214,198,0)'], ['rgba(162,98,242,0.30)', 'rgba(162,98,242,0)'], ['rgba(255,90,168,0.24)', 'rgba(255,90,168,0)']];
      return this._sprite('blob' + k, 128, function (c, s) {
        var g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        g.addColorStop(0, cols[k % 3][0]); g.addColorStop(1, cols[k % 3][1]);
        c.fillStyle = g; c.fillRect(0, 0, s, s);
      });
    },
    _cloudSprite: function (k) {
      return this._sprite('cloud' + k, 160, function (c, s) {
        var puffs = [[[0.3, 0.6, 0.2], [0.5, 0.45, 0.26], [0.72, 0.6, 0.2], [0.5, 0.66, 0.22]],
          [[0.25, 0.62, 0.16], [0.42, 0.5, 0.22], [0.62, 0.48, 0.2], [0.78, 0.62, 0.15], [0.5, 0.68, 0.2]],
          [[0.35, 0.58, 0.22], [0.6, 0.52, 0.24], [0.48, 0.68, 0.18]]][k % 3];
        c.fillStyle = '#FFFFFF';
        for (var i = 0; i < puffs.length; i++) { c.beginPath(); c.arc(puffs[i][0] * s, puffs[i][1] * s * 0.7 + s * 0.1, puffs[i][2] * s, 0, Math.PI * 2); c.fill(); }
        // alt kenar hafif pembe-mor gölge (lagün paletiyle uyumlu)
        c.globalCompositeOperation = 'source-atop';
        var g = c.createLinearGradient(0, s * 0.3, 0, s * 0.75);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(190,149,255,0.55)');
        c.fillStyle = g; c.fillRect(0, 0, s, s);
      });
    },
    _haloSprite: function () {
      return this._sprite('halo', 256, function (c, s) {
        var g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        g.addColorStop(0, 'rgba(255,246,190,0.55)'); g.addColorStop(0.35, 'rgba(180,255,247,0.28)');
        g.addColorStop(0.7, 'rgba(162,98,242,0.12)'); g.addColorStop(1, 'rgba(162,98,242,0)');
        c.fillStyle = g; c.fillRect(0, 0, s, s);
      });
    },
    _starSprite: function () {
      return this._sprite('star', 32, function (c, s) {
        var h = s / 2;
        var g = c.createRadialGradient(h, h, 0, h, h, h);
        g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.25, 'rgba(255,240,170,0.45)'); g.addColorStop(1, 'rgba(255,240,170,0)');
        c.fillStyle = g; c.fillRect(0, 0, s, s);
        c.fillStyle = '#FFFFFF';
        c.beginPath();
        c.moveTo(h, 1); c.quadraticCurveTo(h + 2, h - 2, s - 1, h); c.quadraticCurveTo(h + 2, h + 2, h, s - 1);
        c.quadraticCurveTo(h - 2, h + 2, 1, h); c.quadraticCurveTo(h - 2, h - 2, h, 1); c.fill();
      });
    },
    _shapeSprite: function (kind, col) {
      var cols = ['#B4FFF7', '#E7D4FF', '#FFD4E8', '#FFF7C9'];
      return this._sprite('shape' + kind + col, 32, function (c, s) {
        c.strokeStyle = cols[col]; c.fillStyle = cols[col]; c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round';
        var h = s / 2;
        if (kind === 0) { c.beginPath(); c.arc(h, h, h - 4, 0, Math.PI * 2); c.stroke(); }             // halka
        else if (kind === 1) { c.beginPath(); c.moveTo(h, 4); c.lineTo(h, s - 4); c.moveTo(4, h); c.lineTo(s - 4, h); c.stroke(); }   // artı
        else { c.beginPath(); c.moveTo(h, 3); c.lineTo(s - 5, h); c.lineTo(h, s - 3); c.lineTo(5, h); c.closePath(); c.fill(); }      // eşkenar dörtgen
      });
    },
    _decorSprite: function (d) {
      var key = d.monster + '|' + d.r;
      if (this.sprites[key]) return this.sprites[key];
      var dpr = this.dpr, size = (d.r + 6) * 2;
      var c = BC.Gfx.makeCanvas(size * dpr, size * dpr);
      var ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.translate(size / 2, size / 2);
      var col = BC.COLOR_BY_KEY[d.color];
      BC.Gfx.paintBubble(ctx, d.r, col, { glass: true });
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, d.r * 0.94, 0, Math.PI * 2);
      ctx.clip();
      BC.MonsterPainter.draw(ctx, d.monster, 0, d.r * 0.1, d.r * 1.55, { expr: 'happy' });
      ctx.restore();
      BC.Gfx.paintBubbleGloss(ctx, d.r, col, {});
      this.sprites[key] = c;
      return c;
    },

    /* ---------- Pofi çevresindeki küçük baloncuk ve yıldızlar (havuzdan) ---------- */
    _spawnMascotBubble: function (burst) {
      var m = this.mascot, b = null;
      for (var i = 0; i < m.bubbles.length; i++) if (!m.bubbles[i].on) { b = m.bubbles[i]; break; }
      if (!b) return;
      b.on = true; b.t = 0; b.life = 2.4 + Math.random();
      b.x = m.w * 0.5 + (burst ? (Math.random() - 0.5) * 60 : 46); b.y = m.h * 0.5;
      b.vx = (Math.random() - 0.3) * (burst ? 60 : 18); b.vy = -(28 + Math.random() * 30);
      b.r = 3 + Math.random() * 6;
    },
    _spawnStars: function (n) {
      var m = this.mascot;
      if (this.calm) n = Math.min(n, 2);
      for (var i = 0, k = 0; i < m.stars.length && k < n; i++) {
        var s = m.stars[i];
        if (s.on) continue;
        k++;
        var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
        var sp = 70 + Math.random() * 70;
        s.on = true; s.t = 0; s.life = 0.8 + Math.random() * 0.5;
        s.x = m.w * 0.5 + Math.cos(a) * m.w * 0.18; s.y = m.h * 0.45 + Math.sin(a) * m.h * 0.15;
        s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp; s.s = 5 + Math.random() * 5; s.rot = Math.random() * 6.28; s.col = i % 3;
      }
    },

    /* ---------- Güncelleme ---------- */
    update: function (dt) {
      this.t += dt;
      var t = this.t, w = this.w, h = this.h, i;
      var calm = this.calm, low = this.low;
      var mv = calm ? 0.35 : 1;                  // hareket azaltmada süsler yavaşlar
      this.ambient.update(dt * mv, t);
      for (i = 0; i < this.clouds.length; i++) {
        var c = this.clouds[i];
        if (calm) break;
        c.x += c.v * dt;
        if (c.x > w + 120) { c.x = -170 * c.s; c.y = h * (c.far ? 0.06 + Math.random() * 0.3 : 0.2 + Math.random() * 0.45); }
      }
      if (!low && !calm) {
        for (i = 0; i < this.motes.length; i++) {
          var o = this.motes[i];
          o.y -= o.v * dt; o.x += Math.sin(t * 0.8 + o.ph) * 6 * dt;
          if (o.y < -10) this._resetMote(o, false);
        }
      }
      for (i = 0; i < this.shapes.length; i++) this.shapes[i].rot += this.shapes[i].vr * dt * mv;
      this._updateMascot(dt);
    },

    _updateMascot: function (dt) {
      var m = this.mascot, calm = this.calm;
      m.t += dt;
      if (m.jump > 0) m.jump = Math.max(0, m.jump - dt * 1.4);
      if (m.happyT > 0) m.happyT -= dt;
      if (m.cheer > 0) m.cheer = Math.max(0, m.cheer - dt * 0.45);
      if (m.moodT > 0) { m.moodT -= dt; if (m.moodT <= 0) m.mood = null; }
      m.blinkT -= dt;
      if (m.blinkT < -0.13) m.blinkT = 2.2 + Math.random() * 2.5;
      m.waveT -= dt;
      if (m.waveT <= 0) { m.wave = calm ? 0 : 1.6; m.waveT = 5 + Math.random() * 4; }
      if (m.wave > 0) m.wave = Math.max(0, m.wave - dt);
      // ara sıra küçük kafa eğme (hareket azaltmada yok)
      m.tiltT -= dt;
      if (m.tiltT <= 0) {
        m.tiltTarget = calm ? 0 : (m.tiltTarget === 0 ? (Math.random() < 0.5 ? -1 : 1) * (0.06 + Math.random() * 0.06) : 0);
        m.tiltT = m.tiltTarget === 0 ? 3 + Math.random() * 3 : 0.9 + Math.random() * 0.6;
      }
      m.tilt += (m.tiltTarget - m.tilt) * Math.min(1, dt * 5);
      var tx = Math.sin(m.t * 0.7) * 0.4, ty = Math.sin(m.t * 0.45) * 0.2;
      if (m.px !== null && m.rect) {
        var cx = m.rect.left + m.rect.width / 2, cy = m.rect.top + m.rect.height * 0.45;
        tx = U.clamp((m.px - cx) / 160, -1, 1);
        ty = U.clamp((m.py - cy) / 160, -1, 1);
      }
      m.lookX += (tx - m.lookX) * Math.min(1, dt * 6);
      m.lookY += (ty - m.lookY) * Math.min(1, dt * 6);
      if (!calm && Math.random() < dt * (this.low ? 0.5 : 1.1)) this._spawnMascotBubble(false);
      if (!calm && Math.random() < dt * 0.18) this._spawnStars(1);   // zaman zaman küçük yıldız
      var i, b;
      for (i = 0; i < m.bubbles.length; i++) {
        b = m.bubbles[i];
        if (!b.on) continue;
        b.t += dt;
        b.x += b.vx * dt + Math.sin(b.t * 3 + i) * 8 * dt;
        b.y += b.vy * dt;
        if (b.t > b.life || b.y < -10) b.on = false;
      }
      for (i = 0; i < m.stars.length; i++) {
        b = m.stars[i];
        if (!b.on) continue;
        b.t += dt;
        b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 90 * dt; b.vx *= 1 - dt * 1.5; b.rot += dt * 3;
        if (b.t > b.life) b.on = false;
      }
    },

    /* ---------- Çizim ---------- */
    render: function (ctx) {
      var dpr = this.dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (this.bg) ctx.drawImage(this.bg, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var w = this.w, h = this.h, t = this.t, i, spr;
      var live = this.mode === 'live';
      // uzak renk lekeleri (çok yavaş salınır)
      for (i = 0; i < this.blobs.length; i++) {
        var bl = this.blobs[i];
        var bx = bl.x + Math.sin(t * bl.sp + bl.ph) * w * 0.06, by = bl.y + Math.cos(t * bl.sp * 0.8 + bl.ph) * h * 0.03;
        ctx.drawImage(this._blobSprite(bl.k), bx - bl.r, by - bl.r, bl.r * 2, bl.r * 2);
      }
      // bulutlar: uzak kat (her kalitede), yakın kat (düşük kalitede yok)
      for (i = 0; i < this.clouds.length; i++) {
        var c = this.clouds[i];
        if (this.low && !c.far) continue;
        var cw = 160 * c.s;
        ctx.globalAlpha = c.a;
        ctx.drawImage(this._cloudSprite(c.k), c.x, c.y, cw, cw);
      }
      ctx.globalAlpha = 1;
      // süs şekilleri (çok soluk, yavaş döner)
      for (i = 0; i < this.shapes.length; i++) {
        if (this.low && i % 2) continue;
        var s = this.shapes[i];
        ctx.save();
        ctx.globalAlpha = 0.13 + Math.sin(t * 0.5 + s.ph) * 0.05;
        ctx.translate(s.x, s.y + Math.sin(t * 0.4 + s.ph) * 4);
        ctx.rotate(s.rot);
        ctx.drawImage(this._shapeSprite(s.kind, s.col), -s.s, -s.s, s.s * 2, s.s * 2);
        ctx.restore();
      }
      this.ambient.draw(ctx, 0.9);
      // ışık parçacıkları
      if (!this.low && !this.calm) {
        ctx.fillStyle = '#FFF7D6';
        for (i = 0; i < this.motes.length; i++) {
          var o = this.motes[i];
          ctx.globalAlpha = o.a * (0.6 + 0.4 * Math.sin(t * 2 + o.ph));
          ctx.fillRect(o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);
        }
        ctx.globalAlpha = 1;
      }
      // seyrek yıldız parıltıları
      spr = this._starSprite();
      var nTw = this.low ? 4 : this.twinkles.length;
      for (i = 0; i < nTw; i++) {
        var tw = this.twinkles[i];
        var u = ((t + tw.ph) % tw.per) / tw.per;           // döngünün yalnızca kısa bir anında parlar
        var a = u < 0.12 ? Math.sin(u / 0.12 * Math.PI) : 0;
        if (this.calm) a *= 0.5;
        if (a <= 0.01) continue;
        ctx.globalAlpha = a * 0.85;
        var ss = tw.s * (0.7 + a * 0.5);
        ctx.drawImage(spr, tw.x - ss, tw.y - ss, ss * 2, ss * 2);
      }
      ctx.globalAlpha = 1;
      var mr = this.mascot.rect;
      if (live && mr && mr.width > 0) {
        // Pofi'nin arkasındaki yumuşak hale
        var hs = Math.max(mr.width, mr.height) * 1.25 * (1 + (this.calm ? 0 : Math.sin(t * 1.4) * 0.04));
        var hx = mr.left + mr.width / 2, hy = mr.top + mr.height * 0.52;
        ctx.globalAlpha = 0.9;
        ctx.drawImage(this._haloSprite(), hx - hs / 2, hy - hs / 2, hs, hs);
        ctx.globalAlpha = 1;
        // yan canavar baloncukları (yer varsa)
        var room = Math.min(mr.left, w - mr.right);
        if (room > 52) {
          for (i = 0; i < this.decor.length; i++) {
            var d = this.decor[i];
            var ds = this._decorSprite(d);
            var size = (d.r + 6) * 2;
            var cx = d.fx < 0 ? Math.max(d.r + 8, mr.left - room * 0.5) : Math.min(w - d.r - 8, mr.right + room * 0.5);
            var amp = this.calm ? 0.3 : 1;
            var x = cx + Math.sin(t * 0.6 + d.ph) * 7 * amp;
            var y = mr.top + mr.height * d.fy + Math.sin(t * 0.9 + d.ph * 1.3) * 9 * amp;
            // logo yazısının üstüne binmesin; yer yoksa bu süs çizilmez
            var minY = (this.logoRect && this.logoRect.height ? this.logoRect.bottom : 0) + d.r + 10, maxY = mr.bottom - d.r;
            if (minY > maxY) continue;
            if (y < minY) y = minY + Math.sin(t * 0.9 + d.ph * 1.3) * 4 * amp;
            ctx.drawImage(ds, x - size / 2, y - size / 2, size, size);
          }
        }
        this.renderMascot();
      }
    },

    renderMascot: function () {
      var m = this.mascot, c = m.ctx;
      if (!c || !m.w) return;
      var dpr = this.dpr, calm = this.calm;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, m.el.width, m.el.height);
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      var t = m.t;
      // bekleme: hafif zıplama + nefes (hareket azaltmada yalnızca nefes)
      var cycle = (t * (m.mood === 'excited' ? 2.2 : 1.1)) % 1;
      var hop = calm ? 0 : Math.max(0, Math.sin(cycle * Math.PI * 2)) * 6;
      var breath = Math.sin(t * 2.1) * 0.022;
      var squash = (calm ? 0 : Math.sin(cycle * Math.PI * 2) * 0.03) + breath;
      if (m.jump > 0) { var j = 1 - m.jump; hop += Math.sin(j * Math.PI) * 34 * m.jump * (calm ? 0.4 : 1); squash -= Math.sin(j * Math.PI * 2) * 0.08 * m.jump; }
      var size = Math.min(m.w * 0.72, m.h * 0.76);
      var cx = m.w / 2, cy = m.h * 0.52 - hop;
      c.fillStyle = 'rgba(16,4,54,0.3)';
      c.beginPath();
      c.ellipse(cx, m.h * 0.52 + size * 0.47, Math.max(4, size * 0.32 - hop * 0.3), size * 0.07, 0, 0, Math.PI * 2);
      c.fill();
      var expr;
      if (m.mood === 'excited') expr = m.moodT > 0.55 ? 'wow' : 'happy';
      else if (m.mood === 'happy' || m.happyT > 0) expr = m.blinkT < 0 ? 'blink' : 'happy';
      else expr = m.blinkT < 0 ? 'blink' : 'idle';
      var wave = m.wave > 0 ? Math.sin(m.wave * 9) * 0.5 + 1.3 : 0;
      var cheer = m.cheer > 0 ? 1.5 + Math.sin(t * 14) * 0.25 * m.cheer : 0;
      var nod = m.mood === 'encourage' ? Math.sin(t * 5) * 0.05 : 0;   // cesaretlendirici baş sallama
      BC.MonsterPainter.draw(c, 'pofi', cx, cy, size, {
        expr: expr, lookX: m.lookX, lookY: m.lookY, squash: squash, arms: true, feet: true,
        armR: Math.max(wave, cheer), armL: cheer, tilt: m.tilt + nod, t: t
      });
      var i, b;
      for (i = 0; i < m.bubbles.length; i++) {
        b = m.bubbles[i];
        if (!b.on) continue;
        var a = Math.min(1, b.t * 3) * Math.max(0, 1 - b.t / b.life);
        c.globalAlpha = a;
        c.strokeStyle = 'rgba(220,255,252,0.9)';
        c.lineWidth = 1.4;
        c.beginPath();
        c.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.75)';
        c.beginPath();
        c.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25, 0, Math.PI * 2);
        c.fill();
      }
      var STAR_COLS = ['#FFE066', '#FFFFFF', '#B4FFF7'];
      for (i = 0; i < m.stars.length; i++) {
        b = m.stars[i];
        if (!b.on) continue;
        c.globalAlpha = Math.max(0, 1 - b.t / b.life);
        c.save();
        c.translate(b.x, b.y); c.rotate(b.rot);
        c.fillStyle = STAR_COLS[b.col];
        c.beginPath();
        for (var k = 0; k < 10; k++) {
          var rr = k % 2 ? b.s * 0.45 : b.s, aa = k * Math.PI / 5 - Math.PI / 2;
          if (k) c.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr); else c.moveTo(Math.cos(aa) * rr, Math.sin(aa) * rr);
        }
        c.closePath(); c.fill();
        c.restore();
      }
      c.globalAlpha = 1;
    }
  };

  /* ---------- Motor ---------- */
  var Engine = {
    canvas: null, ctx: null, w: 1, h: 1, dpr: 1, dprCap: 2,
    insets: { top: 0, right: 0, bottom: 0, left: 0 },
    scene: 'menu',
    view: null,
    menu: Menu,
    raf: 0,
    last: 0,
    running: false,
    frameErrors: 0,
    qualityLevel: 'auto',
    autoLow: false,
    reducedMotion: false,
    lastWinRecord: null,
    perf: { acc: 0, n: 0, avgMs: 16.7, fps: 60, slow: 0, frames: 0 },
    _resizeQueued: false,

    boot: function (restore) {
      restore = restore || {};
      BC.log.info('Açılış: sürüm ' + BC.VERSION);
      document.documentElement.lang = 'tr';
      var report = BC.SaveManager.init();
      // 1.000 seviyenin tamamı testlerde doğrulanır; açılışta yalnızca seviye
      // sayısının kesintisiz olduğu denetlenir (her seviye ilk açılışında ayrıca doğrulanır)
      if (BC.LevelManager.count() < BC.LevelManager.PLANNED_TOTAL) BC.log.warn('Tanımlı seviye: ' + BC.LevelManager.count());
      this.canvas = $('world');
      this.ctx = this.canvas.getContext('2d', { alpha: false });
      this.view = new BC.GameView();
      try { this.reducedMotion = !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { /* yoksay */ }
      if (this.reducedMotion) document.documentElement.classList.add('reduced-motion');
      this.applySettings();
      BC.UI.init();
      Menu.init();
      BC.Tutorial.init(this.view);
      this._bindEvents();
      this._bindInput();
      this._bindLifecycle();
      this.resize(true);
      BC.UI.show(restore.screen === 'levels' || restore.screen === 'collection' ? restore.screen : 'menu');
      BC.Audio.playMusic();
      this._hot();
      this.start();
      // açılış bildirimleri
      if (!report.persistent) BC.UI.toastOnce('nopersist', 'Bu tarayıcı ilerlemeyi kalıcı kaydetmiyor; oyun yine de oynanır.', 4200);
      else if (report.source === 'yedek') BC.UI.toastOnce('backup', 'Kayıt yedekten geri yüklendi.', 3500);
      else if (report.source === 'varsayılan') BC.UI.toastOnce('reset', 'Kayıt okunamadı; yeni bir oyun başlatıldı.', 3500);
      var splash = $('splash');
      var hide = function () { splash.classList.add('out'); setTimeout(function () { splash.hidden = true; }, 450); };
      if (document.fonts && document.fonts.ready) {
        var done = false;
        document.fonts.ready.then(function () { if (!done) { done = true; hide(); } });
        setTimeout(function () { if (!done) { done = true; hide(); } }, 700);
      } else hide();
    },

    applySettings: function () {
      var s = BC.SaveManager.data.settings;
      BC.Audio.init(s);
      if (BC.Audio.ctx) { BC.Audio.setSfx(s.sfx); BC.Audio.setMusic(s.music); }
      BC.Haptics.enabled = s.haptics;
      this.applyQuality(true);
    },

    applySymbols: function (on) {
      BC.Sprites.setScale(BC.Sprites.k, on);
    },

    applyQuality: function (silent) {
      var q = BC.SaveManager.data.settings.quality;
      var level = q === 'auto' ? (this.autoLow ? 'low' : 'auto') : q;
      this.qualityLevel = level;
      this.dprCap = level === 'high' ? 3 : level === 'low' ? 1.5 : 2;
      var low = level === 'low';
      var v = this.view;
      v.quality = { density: low ? 0.5 : 1, shake: !low && !this.reducedMotion, ambient: !low };
      v.fx.density = v.sfx.density = low ? 0.5 : (this.reducedMotion ? 0.7 : 1);
      v.fx.setCapacity(low ? 220 : 420);
      v.sfx.setCapacity(low ? 140 : 240);
      document.documentElement.setAttribute('data-quality', level);
      Menu.configure(low, this.reducedMotion);
      if (!silent) this.resize(true);
    },

    _readInsets: function () {
      var probe = this._probe;
      if (!probe) {
        probe = this._probe = document.createElement('div');
        probe.className = 'inset-probe';
        document.body.appendChild(probe);
      }
      var cs = root.getComputedStyle(probe);
      return {
        top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0,
        bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0
      };
    },

    resize: function (force) {
      var app = $('app');
      var rect = app.getBoundingClientRect();
      var w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
      var dpr = Math.min(root.devicePixelRatio || 1, this.dprCap);
      // güvenli alan boşlukları boyut değişmeden de değişebilir (çentik, durum çubuğu)
      var ins = this._readInsets(), old = this.insets;
      var sameInsets = old && ins.top === old.top && ins.bottom === old.bottom && ins.left === old.left && ins.right === old.right;
      if (!force && w === this.w && h === this.h && dpr === this.dpr && sameInsets) return;
      this.w = w; this.h = h; this.dpr = dpr;
      this.insets = ins;
      this.canvasRect = rect;
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
      this.canvas.style.width = w + 'px';
      this.canvas.style.height = h + 'px';
      Menu.resize(w, h, dpr);
      this.view.resize(w, h, dpr, this.insets);
      var hr = this.view.hudRect(), pb = $('btn-pause');
      pb.style.left = hr.btnX + 'px';
      pb.style.top = hr.btnY + 'px';
      pb.style.right = 'auto';
      BC.Tutorial.onResize();
      var landscapePhone = w > h && h < 500;
      document.documentElement.classList.toggle('is-landscape-phone', landscapePhone);
      if (landscapePhone && this.scene === 'game') this.pause();
      this.renderOnce();
    },

    renderOnce: function () {
      try {
        if (this.scene === 'game') this.view.render(this.ctx);
        else Menu.render(this.ctx);
      } catch (e) { BC.log.error('Çizim hatası', e); }
    },

    start: function () {
      if (this.running) return;
      this.running = true;
      this.last = U.now();
      var self = this;
      var frame = function (now) {
        if (!self.running) return;
        self.raf = root.requestAnimationFrame(frame);
        var dt = (now - self.last) / 1000;
        self.last = now;
        if (!(dt > 0)) return;
        if (document.hidden) return;              // arka planda hiçbir sahne güncellenmez/çizilmez
        if (dt > 0.05) dt = 0.05;
        self._tick(dt);
      };
      this.raf = root.requestAnimationFrame(frame);
    },

    stop: function () {
      this.running = false;
      if (this.raf) root.cancelAnimationFrame(this.raf);
    },

    _tick: function (dt) {
      try {
        if (this.scene === 'game') {
          this.view.update(dt);
          this.view.render(this.ctx);
          BC.Tutorial.update(dt);
          this._trackPerf(dt);
        } else if (Menu.mode === 'live') {
          Menu.update(dt);
          Menu.render(this.ctx);
          Menu.frames++;
        } else if (!Menu.staticDrawn) {
          // menü başka bir ekranın arkasında: arka plan bir kez durağan çizilir
          Menu.render(this.ctx);
          Menu.staticDrawn = true;
        }
        this.frameErrors = 0;
      } catch (e) {
        this.frameErrors++;
        BC.log.error('Kare hatası', e);
        if (this.frameErrors > 3) this.fatal(e);
      }
    },

    _trackPerf: function (dt) {
      var p = this.perf;
      if (this.view.paused) return;
      p.frames++;
      p.acc += dt; p.n++;
      if (p.n >= 120) {
        p.avgMs = p.acc / p.n * 1000;
        p.fps = Math.round(1000 / p.avgMs);
        p.acc = 0; p.n = 0;
        var auto = BC.SaveManager.data.settings.quality === 'auto';
        if (auto && !this.autoLow && p.avgMs > 26 && !document.hidden) {
          p.slow++;
          if (p.slow >= 2) {
            this.autoLow = true;
            BC.log.warn('Düşük performans: efektler azaltıldı (ortalama ' + p.avgMs.toFixed(1) + ' ms)');
            this.applyQuality();
          }
        } else p.slow = 0;
      }
    },

    /* ---------- Sahne geçişleri ---------- */
    startLevel: function (n) {
      if (!BC.LevelManager.exists(n)) return false;
      if (BC.UI.modalOpen) BC.UI.closeModal(true);
      this.scene = 'game';
      BC.UI.show('game');
      this.view.resize(this.w, this.h, this.dpr, this.insets);
      this.view.start(n);
      BC.Tutorial.prepare(this.view.level);
      this.renderOnce();
      this._levelIntros(n);
      return true;
    },

    /**
     * Seviye başında bir kez gösterilen tanıtımlar: yeni dünya ve yenilik kartı
     * (05-features.js). Kart açıkken oyun bekler; kapanınca giriş animasyonu sürer.
     */
    _levelIntros: function (n) {
      var d = BC.SaveManager.data, self = this, queue = [];
      var w = BC.worldOf(n);
      if (n === w.from && w.id > d.progress.worldSeen) queue.push(function (next) { BC.UI.openWorldIntro(w, next); });
      var f = BC.Features.introCard(n);
      if (f && d.features.seen[f.id]) f = null;
      // Aşama 5: tanıtım seviyesini (ör. 51) önceki sürümde geçmiş oyuncu, mekaniği ilk
      // gördüğü seviyede aynı kartı görür (kayıt uyumu: yeni mekanik açıklamasız gelmez)
      if (!f) {
        var mech = (this.view.level && this.view.level.mechanics) || [];
        for (var i = 0; i < mech.length && !f; i++) {
          var mf = BC.Features.byMechanic(mech[i]);
          if (mf && mf.card && !d.features.seen[mf.id]) f = mf;
        }
      }
      if (f) queue.push(function (next) { BC.UI.openFeatureCard(f, next); });
      if (!queue.length) return;
      this.view.paused = true;
      var step = function () {
        var fn = queue.shift();
        if (!fn) {
          if (self.scene === 'game') { self.view.paused = false; self.last = U.now(); }
          return;
        }
        fn(step);
      };
      step();
    },

    restartLevel: function () {
      if (this.view.levelN) this.startLevel(this.view.levelN);
    },

    quitToMenu: function () {
      BC.Tutorial.stop(false);
      if (BC.UI.modalOpen) BC.UI.closeModal(true);
      if (this.scene === 'game' && this.view.session && this.view.phase !== 'done') {
        BC.RewardManager.addPlayTime(Date.now() - (this.view.startedAt || Date.now()));
      }
      this.view.paused = false;
      this.scene = 'menu';
      BC.UI.show('menu');
      this.renderOnce();
    },

    pause: function () {
      if (this.scene !== 'game' || BC.UI.modalOpen) return;
      if (this.view.phase === 'done') return;
      this.view.paused = true;
      this.view.pointerCancel();
      BC.UI.openPause();
    },

    resume: function () {
      this.view.paused = false;
      this.last = U.now();
    },

    fatal: function (e) {
      BC.log.error('Kurtarma moduna geçildi', e);
      this.scene = 'menu';
      this.view.paused = true;
      $('fatal').hidden = false;
    },

    recover: function () {
      $('fatal').hidden = true;
      this.frameErrors = 0;
      this.quitToMenu();
    },

    /* ---------- Olaylar ---------- */
    _bindEvents: function () {
      var self = this;
      BC.events.on('game:start', function (e) { BC.RewardManager.recordAttempt(e.level); });
      BC.events.on('game:won', function (res) {
        self.lastWinRecord = BC.RewardManager.recordWin(res.level, res);
        BC.RewardManager.addPlayTime(res.ms);
      });
      BC.events.on('game:winDone', function (res) {
        if (BC.UI.current === 'game' && self.scene === 'game') BC.UI.openWin(res, self.lastWinRecord);
      });
      BC.events.on('game:lost', function (res) {
        BC.RewardManager.recordLoss(res.level, res);
        BC.RewardManager.addPlayTime(res.ms);
      });
      BC.events.on('game:loseDone', function (res) {
        if (BC.UI.current === 'game' && self.scene === 'game') BC.UI.openLose(res);
      });
    },

    _bindInput: function () {
      var self = this, cv = this.canvas;
      var pos = function (e) {
        var r = self.canvasRect || cv.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      };
      cv.addEventListener('pointerdown', function (e) {
        BC.Audio.unlock();
        if (self.scene !== 'game' || BC.UI.modalOpen) return;
        e.preventDefault();
        try { cv.setPointerCapture(e.pointerId); } catch (err) { /* yoksay */ }
        self.canvasRect = cv.getBoundingClientRect();
        var p = pos(e);
        self.view.pointerDown(e.pointerId, p.x, p.y);
      });
      cv.addEventListener('pointermove', function (e) {
        if (self.scene !== 'game') return;
        var p = pos(e);
        self.view.pointerMove(e.pointerId, p.x, p.y);
      });
      cv.addEventListener('pointerup', function (e) {
        if (self.scene !== 'game') return;
        var p = pos(e);
        self.view.pointerUp(e.pointerId, p.x, p.y);
      });
      cv.addEventListener('pointercancel', function () { self.view.pointerCancel(); });
      cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      // iOS ses kilidi: ilk dokunuş/tıklama her yerde
      var unlock = function () { BC.Audio.unlock(); };
      document.addEventListener('pointerdown', unlock, true);
      document.addEventListener('touchend', unlock, true);
      document.addEventListener('keydown', unlock, true);
    },

    _bindLifecycle: function () {
      var self = this;
      var queue = function () {
        if (self._resizeQueued) return;
        self._resizeQueued = true;
        root.requestAnimationFrame(function () { self._resizeQueued = false; self.resize(false); });
      };
      root.addEventListener('resize', queue);
      root.addEventListener('orientationchange', function () { setTimeout(queue, 120); });
      if (root.visualViewport) root.visualViewport.addEventListener('resize', queue);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (self.scene === 'game' && !self.view.paused && self.view.phase !== 'done') self.pause();
          BC.Audio.suspend();
          BC.SaveManager.flush();
        } else {
          BC.Audio.resume();
          self.last = U.now();
        }
      });
      root.addEventListener('pagehide', function () { BC.SaveManager.flush(); });
      root.addEventListener('blur', function () { BC.SaveManager.flush(); });
      root.addEventListener('error', function (e) { BC.log.error('Yakalanmamış hata: ' + (e && e.message), e && e.error); });
      root.addEventListener('unhandledrejection', function (e) { BC.log.error('Yakalanmamış söz reddi', e && e.reason); });
    },

    /* Claude yapıt görüntüleyicisinde canlı güncelleme kancası (yoksa etkisiz) */
    _hot: function () {
      var hot = root.claude && root.claude.hot;
      if (hot && typeof hot.snapshot === 'function') {
        try { hot.snapshot(function () { return { screen: BC.UI.current }; }); } catch (e) { /* yoksay */ }
      }
    }
  };

  BC.Engine = Engine;

  /* ---------- Test ve hata ayıklama kancaları ---------- */
  BC.Debug = {
    state: function () {
      var v = Engine.view;
      return {
        screen: BC.UI.current,
        scene: Engine.scene,
        modal: BC.UI.modalOpen ? $('modal-title').textContent : null,
        game: v.snapshot(),
        tutorial: BC.Tutorial.id ? { id: BC.Tutorial.id, step: BC.Tutorial.step } : null,
        quality: Engine.qualityLevel,
        fps: Engine.perf.fps,
        avgMs: Engine.perf.avgMs,
        persistent: BC.SaveManager.persistent,
        saveReport: BC.SaveManager.report
      };
    },
    counts: function () {
      var v = Engine.view;
      return {
        fx: v.fx.n, sfx: v.sfx.n, poppers: v.poppers.length, fallers: v.fallers.length,
        flyers: v.flyers.length, timers: (v._timers || []).length, bonus: v.bonusShots.length,
        menuBubbles: Menu.mascot.bubbles.filter(function (b) { return b.on; }).length,
        menuStars: Menu.mascot.stars.filter(function (b) { return b.on; }).length
      };
    },
    setTimeScale: function (x) { Engine.view.timeScale = x; },
    botShot: function (profile) {
      var v = Engine.view;
      if (!v.canAct()) return false;
      var p = BC.Bot.plan(v.session, profile || {});
      if (!p) return false;
      if (p.swap) v.swap();
      return v.fire(p.angle);
    },
    fireAt: function (deg) { return Engine.view.fire(U.rad(deg)); },
    /** Aşama 5: ana menü sahnesinin durumu (testler: görünmezken çalışmama, kalite, havuz boyutları) */
    menuInfo: function () {
      var m = Menu.mascot;
      return {
        mode: Menu.mode, frames: Menu.frames, t: Menu.t, low: Menu.low, calm: Menu.calm,
        ambient: Menu.ambient.items.length, motes: Menu.motes.length, clouds: Menu.clouds.length,
        mood: m.mood, pendingMood: m.pendingMood,
        pools: { bubbles: m.bubbles.length, stars: m.stars.length }
      };
    },
    skipIntro: function () { Engine.view._endIntro(); Engine.view.banner = null; },

    /**
     * Aşama 4: gerçek cihaz testi için cihaz bilgisi (docs/IOS-TEST-REHBERI.md).
     * Yalnızca bu cihazda gösterilir; hiçbir yere gönderilmez, kaydedilmez.
     */
    deviceInfo: function () {
      var nav = root.navigator || {};
      var mm = function (q) { try { return !!(root.matchMedia && root.matchMedia(q).matches); } catch (e) { return false; } };
      var ins = Engine.insets || {};
      var A = BC.Audio || {};
      return {
        version: BC.VERSION + ' (Aşama ' + BC.STAGE + ')',
        userAgent: String(nav.userAgent || ''),
        language: String(nav.language || ''),
        viewport: Math.round(root.innerWidth || 0) + '×' + Math.round(root.innerHeight || 0),
        screen: root.screen ? root.screen.width + '×' + root.screen.height : '',
        dpr: root.devicePixelRatio || 1,
        canvasDpr: Engine.dpr,
        safeArea: { top: ins.top || 0, right: ins.right || 0, bottom: ins.bottom || 0, left: ins.left || 0 },
        standalone: !!(nav.standalone || mm('(display-mode: standalone)')),
        touchPoints: nav.maxTouchPoints || 0,
        coarsePointer: mm('(pointer: coarse)'),
        reducedMotion: !!Engine.reducedMotion,
        storage: BC.SaveManager.persistent ? 'kalıcı' : 'yalnızca bellek (kapanınca silinir)',
        saveSource: BC.SaveManager.report ? BC.SaveManager.report.source : null,
        audio: A.ctx ? A.ctx.state + (A.unlocked ? ', açıldı' : ', ilk dokunuş bekleniyor') : 'desteklenmiyor',
        fps: Engine.perf.fps,
        frameMs: Math.round(Engine.perf.avgMs * 10) / 10,
        quality: Engine.qualityLevel,
        time: new Date().toISOString()
      };
    },
    /** deviceInfo() → test raporuna yapıştırılacak düz metin */
    deviceReport: function () {
      var i = BC.Debug.deviceInfo();
      return [
        'Baloncuk Canavarları ' + i.version,
        'Zaman: ' + i.time,
        'Tarayıcı: ' + i.userAgent,
        'Dil: ' + i.language,
        'Görünüm (CSS px): ' + i.viewport + ' · ekran: ' + i.screen + ' · DPR: ' + i.dpr + ' (tuval ' + i.canvasDpr + ')',
        'Güvenli alan (üst/sağ/alt/sol px): ' + [i.safeArea.top, i.safeArea.right, i.safeArea.bottom, i.safeArea.left].join(' / '),
        'Ana ekrandan açıldı: ' + (i.standalone ? 'evet' : 'hayır') + ' · dokunma noktası: ' + i.touchPoints + ' · kaba işaretçi: ' + (i.coarsePointer ? 'evet' : 'hayır'),
        'Azaltılmış hareket: ' + (i.reducedMotion ? 'evet' : 'hayır') + ' · kalite: ' + i.quality,
        'Kare hızı: ' + i.fps + ' fps (ortalama ' + i.frameMs + ' ms)',
        'Ses: ' + i.audio,
        'Kayıt: ' + i.storage + (i.saveSource ? ' · kaynak: ' + i.saveSource : '')
      ].join('\n');
    }
  };

  /* ---------- Açılış ---------- */
  function start(data) {
    try {
      Engine.boot(data || {});
    } catch (e) {
      BC.log.error('Açılış hatası', e);
      var f = $('fatal');
      if (f) f.hidden = false;
    }
  }
  function ready() {
    var hot = root.claude && root.claude.hot;
    if (hot && typeof hot.ready === 'function') {
      try { hot.ready(start); return; } catch (e) { /* yoksay */ }
    }
    start((hot && hot.data) || {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
